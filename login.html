<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#050507"
  >

  <meta
    name="description"
    content="تسجيل الدخول إلى منصة Mathix"
  >

  <title>تسجيل الدخول | Mathix</title>


  <!-- Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --bg: #050507;
      --bg-2: #08080d;

      --surface: rgba(17, 17, 25, .72);
      --surface-2: rgba(25, 24, 36, .82);

      --purple: #8b3dff;
      --purple-2: #a75cff;
      --purple-3: #c28cff;

      --text: #f7f5ff;

      --muted: #94919f;
      --muted-2: #6e6b78;

      --green: #35dc88;
      --red: #ff5870;

      --border: rgba(255,255,255,.075);
      --border-purple: rgba(139,61,255,.28);

      --shadow:
        0 25px 80px rgba(0,0,0,.55);

      --glow:
        0 0 60px rgba(139,61,255,.15);

      --radius: 26px;

    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      overflow-x: hidden;

      color: var(--text);

      font-family: "Cairo", sans-serif;

      background:

        radial-gradient(
          circle at 80% 10%,
          rgba(139,61,255,.16),
          transparent 30%
        ),

        radial-gradient(
          circle at 10% 90%,
          rgba(139,61,255,.10),
          transparent 28%
        ),

        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,.015),
          transparent 45%
        ),

        var(--bg);

    }


    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,.012) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.012) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );

      opacity: .45;

    }


    button,
    input {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    ::selection {

      background:
        rgba(139,61,255,.35);

      color: white;

    }


    /* =========================
       LOADING
    ========================= */

    .loading-screen {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #050507;

      transition:
        opacity .4s ease,
        visibility .4s ease;

    }


    .loading-screen.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    .loader {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 18px;

    }


    .loader-logo {

      width: 66px;
      height: 66px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(139,61,255,.25),
          rgba(139,61,255,.04)
        );

      border:
        1px solid var(--border-purple);

      box-shadow:

        0 0 45px
        rgba(139,61,255,.24),

        inset 0 0 30px
        rgba(139,61,255,.08);

      font-family:
        "Chakra Petch",
        sans-serif;

      font-size: 25px;

      font-weight: 800;

      animation:
        loaderPulse 1.5s
        infinite ease-in-out;

    }


    .loader-ring {

      width: 24px;
      height: 24px;

      border-radius: 50%;

      border:
        2px solid
        rgba(255,255,255,.08);

      border-top-color:
        var(--purple-2);

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    @keyframes loaderPulse {

      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

    }


    /* =========================
       PAGE
    ========================= */

    .page {

      width: min(
        1080px,
        100%
      );

      min-height: 680px;

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      position: relative;

      overflow: hidden;

      border-radius: 32px;

      background:
        linear-gradient(
          145deg,
          rgba(20,19,28,.88),
          rgba(8,8,12,.94)
        );

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        var(--shadow),
        var(--glow);

      backdrop-filter:
        blur(25px);

      animation:
        pageIn .7s ease both;

    }


    @keyframes pageIn {

      from {

        opacity: 0;

        transform:
          translateY(20px)
          scale(.98);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =========================
       LEFT SIDE
    ========================= */

    .visual {

      position: relative;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding: 55px;

      overflow: hidden;

      background:

        radial-gradient(
          circle at 50% 40%,
          rgba(139,61,255,.18),
          transparent 42%
        ),

        linear-gradient(
          145deg,
          rgba(139,61,255,.06),
          transparent 70%
        );

      border-left:
        1px solid
        rgba(255,255,255,.055);

    }


    .visual::before {

      content: "";

      position: absolute;

      width: 430px;
      height: 430px;

      border-radius: 50%;

      background:
        rgba(139,61,255,.09);

      filter: blur(80px);

      pointer-events: none;

    }


    .visual-grid {

      position: absolute;

      inset: 0;

      background-image:

        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 35px 35px;

      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 72%
        );

      opacity: .7;

    }


    .visual-content {

      position: relative;

      z-index: 2;

      text-align: center;

    }


    .logo-orb {

      position: relative;

      width: 190px;
      height: 190px;

      margin:
        0 auto
        30px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(139,61,255,.23),
          rgba(139,61,255,.05) 55%,
          transparent 70%
        );

      border:
        1px solid
        rgba(167,92,255,.2);

      box-shadow:

        0 0 90px
        rgba(139,61,255,.16),

        inset 0 0 60px
        rgba(139,61,255,.08);

      animation:
        floatOrb 5s
        ease-in-out
        infinite;

    }


    .logo-orb::before {

      content: "";

      position: absolute;

      inset: 18px;

      border-radius: 50%;

      border:
        1px solid
        rgba(167,92,255,.16);

    }


    .logo-orb::after {

      content: "";

      position: absolute;

      inset: 40px;

      border-radius: 50%;

      border:
        1px solid
        rgba(167,92,255,.13);

    }


    .logo-letter {

      position: relative;

      z-index: 2;

      font-family:
        "Chakra Petch",
        sans-serif;

      font-size: 76px;

      font-weight: 700;

      color: white;

      text-shadow:

        0 0 30px
        rgba(167,92,255,.65),

        0 0 70px
        rgba(139,61,255,.35);

    }


    @keyframes floatOrb {

      0%,100% {

        transform:
          translateY(0)
          rotate(0deg);

      }

      50% {

        transform:
          translateY(-10px)
          rotate(2deg);

      }

    }


    .brand-name {

      font-family:
        "Chakra Petch",
        sans-serif;

      font-size: 42px;

      font-weight: 700;

      letter-spacing: 1px;

    }


    .brand-name span {

      color:
        var(--purple-2);

      text-shadow:
        0 0 25px
        rgba(167,92,255,.35);

    }


    .visual-title {

      margin-top: 10px;

      color:
        var(--muted);

      font-size: 13px;

      line-height: 1.9;

    }


    .visual-pills {

      display: flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 22px;

    }


    .visual-pill {

      padding:
        7px 12px;

      border-radius: 10px;

      background:
        rgba(255,255,255,.025);

      border:
        1px solid
        rgba(255,255,255,.07);

      color:
        var(--muted);

      font-size: 9px;

      font-weight: 700;

    }


    /* =========================
       FORM SIDE
    ========================= */

    .form-side {

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 55px;

      background:
        rgba(7,7,10,.35);

    }


    .form-box {

      width: min(
        390px,
        100%
      );

    }


    .form-header {

      margin-bottom: 28px;

    }


    .eyebrow {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 11px;

      color:
        var(--purple-3);

      font-size: 10px;

      font-weight: 800;

    }


    .eyebrow span {

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background:
        var(--purple-2);

      box-shadow:
        0 0 12px
        rgba(167,92,255,.8);

    }


    .form-header h1 {

      font-size: 29px;

      font-weight: 900;

      letter-spacing: -.5px;

    }


    .form-header p {

      margin-top: 7px;

      color:
        var(--muted);

      font-size: 11px;

      line-height: 1.8;

    }


    /* =========================
       FORM
    ========================= */

    .form {

      display: flex;

      flex-direction: column;

      gap: 15px;

    }


    .field {

      display: flex;

      flex-direction: column;

      gap: 7px;

    }


    .field-label {

      display: flex;

      align-items: center;

      justify-content: space-between;

      color:
        #ddd9e7;

      font-size: 11px;

      font-weight: 800;

    }


    .field-wrap {

      position: relative;

    }


    .field-icon {

      position: absolute;

      right: 15px;

      top: 50%;

      transform:
        translateY(-50%);

      color:
        var(--muted-2);

      font-size: 15px;

      pointer-events: none;

      transition: .25s ease;

    }


    .field input {

      width: 100%;

      height: 53px;

      padding:
        0 46px
        0 45px;

      outline: none;

      border-radius: 15px;

      background:
        rgba(255,255,255,.025);

      border:
        1px solid
        var(--border);

      color: white;

      font-size: 12px;

      transition: .25s ease;

    }


    .field input::placeholder {

      color:
        var(--muted-2);

    }


    .field input:focus {

      background:
        rgba(139,61,255,.045);

      border-color:
        rgba(139,61,255,.42);

      box-shadow:

        0 0 0 3px
        rgba(139,61,255,.06),

        0 0 25px
        rgba(139,61,255,.05);

    }


    .field input:focus
    + .field-icon {

      color:
        var(--purple-2);

    }


    .password-toggle {

      position: absolute;

      left: 12px;

      top: 50%;

      transform:
        translateY(-50%);

      width: 31px;
      height: 31px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background: transparent;

      color:
        var(--muted-2);

      transition: .2s ease;

    }


    .password-toggle:hover {

      color: white;

      background:
        rgba(255,255,255,.04);

    }


    .remember-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-top: -2px;

    }


    .remember {

      display: flex;

      align-items: center;

      gap: 8px;

      color:
        var(--muted);

      font-size: 10px;

      cursor: pointer;

      user-select: none;

    }


    .remember input {

      appearance: none;

      width: 16px;
      height: 16px;

      margin: 0;

      border-radius: 5px;

      background:
        rgba(255,255,255,.025);

      border:
        1px solid
        var(--border);

      cursor: pointer;

      position: relative;

      transition: .2s ease;

    }


    .remember input:checked {

      background:
        var(--purple);

      border-color:
        var(--purple);

    }


    .remember input:checked::after {

      content: "✓";

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color: white;

      font-size: 10px;

      font-weight: 900;

    }


    .forgot {

      color:
        var(--purple-3);

      font-size: 10px;

      font-weight: 700;

      cursor: pointer;

    }


    .forgot:hover {

      color: white;

    }


    /* =========================
       BUTTON
    ========================= */

    .login-btn {

      width: 100%;

      height: 54px;

      margin-top: 5px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      border: 0;

      border-radius: 15px;

      background:

        linear-gradient(
          135deg,
          var(--purple),
          #6925d7
        );

      color: white;

      font-size: 12px;

      font-weight: 900;

      box-shadow:

        0 15px 35px
        rgba(139,61,255,.2);

      transition: .25s ease;

    }


    .login-btn:hover {

      transform:
        translateY(-2px);

      box-shadow:

        0 20px 45px
        rgba(139,61,255,.3);

    }


    .login-btn:active {

      transform:
        translateY(0);

    }


    .login-btn:disabled {

      opacity: .55;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;

    }


    .button-loader {

      width: 17px;
      height: 17px;

      border-radius: 50%;

      border:
        2px solid
        rgba(255,255,255,.3);

      border-top-color:
        white;

      animation:
        spin .7s linear infinite;

    }


    /* =========================
       DIVIDER
    ========================= */

    .divider {

      display: flex;

      align-items: center;

      gap: 12px;

      margin: 22px 0;

      color:
        var(--muted-2);

      font-size: 9px;

    }


    .divider::before,
    .divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(255,255,255,.055);

    }


    /* =========================
       SIGNUP
    ========================= */

    .signup {

      text-align: center;

      color:
        var(--muted);

      font-size: 10px;

    }


    .signup a {

      margin-right: 4px;

      color:
        var(--purple-3);

      font-weight: 900;

      transition: .2s ease;

    }


    .signup a:hover {

      color: white;

    }


    /* =========================
       ERROR
    ========================= */

    .form-error {

      display: none;

      padding: 12px 13px;

      border-radius: 13px;

      background:
        rgba(255,88,112,.07);

      border:
        1px solid
        rgba(255,88,112,.16);

      color:
        #ff9aaa;

      font-size: 10px;

      line-height: 1.8;

    }


    .form-error.show {

      display: block;

      animation:
        shake .35s ease;

    }


    @keyframes shake {

      0%,100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }

    }


    /* =========================
       TOAST
    ========================= */

    .toast {

      position: fixed;

      left: 22px;
      bottom: 22px;

      z-index: 10000;

      min-width: 280px;
      max-width: 390px;

      display: flex;

      align-items: flex-start;

      gap: 11px;

      padding: 14px;

      border-radius: 16px;

      background:
        rgba(18,17,25,.95);

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

      backdrop-filter:
        blur(20px);

      opacity: 0;

      transform:
        translateY(15px);

      pointer-events: none;

    }


    .toast.show {

      animation:
        toastIn .3s ease
        forwards;

    }


    .toast.success {

      border-color:
        rgba(53,220,136,.18);

    }


    .toast.error {

      border-color:
        rgba(255,88,112,.18);

    }


    .toast-icon {

      width: 29px;
      height: 29px;

      flex: 0 0 29px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background:
        rgba(139,61,255,.1);

      font-size: 13px;

    }


    .toast.success .toast-icon {

      background:
        rgba(53,220,136,.08);

    }


    .toast.error .toast-icon {

      background:
        rgba(255,88,112,.08);

    }


    .toast-title {

      font-size: 11px;

      font-weight: 900;

    }


    .toast-message {

      margin-top: 2px;

      color:
        var(--muted);

      font-size: 9px;

      line-height: 1.7;

    }


    @keyframes toastIn {

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 850px) {

      body {

        padding: 15px;

      }


      .page {

        min-height: auto;

        grid-template-columns: 1fr;

        border-radius: 25px;

      }


      .visual {

        min-height: 300px;

        padding: 35px 25px;

        border-left: 0;

        border-bottom:
          1px solid
          rgba(255,255,255,.055);

      }


      .logo-orb {

        width: 125px;
        height: 125px;

        margin-bottom: 18px;

      }


      .logo-letter {

        font-size: 52px;

      }


      .brand-name {

        font-size: 31px;

      }


      .visual-title {

        font-size: 10px;

      }


      .form-side {

        padding:
          38px 25px 42px;

      }

    }


    @media (max-width: 480px) {

      body {

        padding: 10px;

      }


      .page {

        border-radius: 21px;

      }


      .visual {

        min-height: 270px;

        padding:
          28px 18px;

      }


      .form-side {

        padding:
          30px 18px 35px;

      }


      .form-header h1 {

        font-size: 25px;

      }


      .form-header p {

        font-size: 10px;

      }


      .field input {

        height: 51px;

      }


      .toast {

        left: 10px;
        right: 10px;

        min-width: 0;

        max-width: none;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOADING
  ========================= -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="loader">

      <div class="loader-logo">
        M
      </div>

      <div class="loader-ring"></div>

    </div>

  </div>


  <!-- =========================
       PAGE
  ========================= -->

  <main class="page">


    <!-- =========================
         VISUAL
    ========================= -->

    <section class="visual">

      <div class="visual-grid"></div>


      <div class="visual-content">

        <div class="logo-orb">

          <div class="logo-letter">
            M
          </div>

        </div>


        <div class="brand-name">
          Math<span>ix</span>
        </div>


        <p class="visual-title">
          منصتك الذكية للمذاكرة والمراجعة
          <br>
          خليك أقرب لهدفك كل يوم.
        </p>


        <div class="visual-pills">

          <span class="visual-pill">
            علمي رياضة
          </span>

          <span class="visual-pill">
            مراجعات
          </span>

          <span class="visual-pill">
            اختبارات
          </span>

          <span class="visual-pill">
            متابعة التقدم
          </span>

        </div>

      </div>

    </section>


    <!-- =========================
         FORM
    ========================= -->

    <section class="form-side">

      <div class="form-box">


        <div class="form-header">

          <div class="eyebrow">
            <span></span>
            أهلاً بيك في Mathix
          </div>


          <h1>
            تسجيل الدخول
          </h1>


          <p>
            ادخل بيانات حسابك وكمل رحلتك التعليمية.
          </p>

        </div>


        <!-- ERROR -->

        <div
          class="form-error"
          id="formError"
        ></div>


        <!-- FORM -->

        <form
          class="form"
          id="loginForm"
        >


          <!-- EMAIL -->

          <div class="field">

            <label
              class="field-label"
              for="email"
            >
              البريد الإلكتروني
            </label>


            <div class="field-wrap">

              <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="example@gmail.com"
                required
              >


              <span class="field-icon">
                @
              </span>

            </div>

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label
              class="field-label"
              for="password"
            >
              كلمة المرور
            </label>


            <div class="field-wrap">

              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              >


              <span class="field-icon">
                ◆
              </span>


              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="إظهار كلمة المرور"
              >
                ◉
              </button>

            </div>

          </div>


          <!-- REMEMBER -->

          <div class="remember-row">

            <label class="remember">

              <input
                type="checkbox"
                id="rememberMe"
                checked
              >

              <span>
                تذكرني
              </span>

            </label>


            <button
              type="button"
              class="forgot"
              id="forgotPassword"
            >
              نسيت كلمة المرور؟
            </button>

          </div>


          <!-- BUTTON -->

          <button
            class="login-btn"
            id="loginBtn"
            type="submit"
          >

            <span id="loginBtnText">
              تسجيل الدخول
            </span>

          </button>


        </form>


        <div class="divider">
          أو
        </div>


        <div class="signup">

          مش عندك حساب؟

          <a href="./signup.html">
            إنشاء حساب جديد
          </a>

        </div>


      </div>

    </section>

  </main>


  <!-- =========================
       TOAST
  ========================= -->

  <div
    class="toast"
    id="toast"
  >

    <div
      class="toast-icon"
      id="toastIcon"
    >
      ✓
    </div>


    <div>

      <div
        class="toast-title"
        id="toastTitle"
      >
        تم
      </div>


      <div
        class="toast-message"
        id="toastMessage"
      >
        —
      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">


    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      onAuthStateChanged,
      sendPasswordResetEmail
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCH--HkIXYn3qhXZ9TwRItZrnMOIx_lWXk4",

      authDomain:
        "mathix-2008.firebaseapp.com",

      projectId:
        "mathix-2008",

      storageBucket:
        "mathix-2008.firebasestorage.app",

      messagingSenderId:
        "561805658834",

      appId:
        "1:561805658834:web:c1db8ebc2d415be9497b0b",

      measurementId:
        "G-XWHKQ72FM0"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(app);


    /* =========================
       DOM
    ========================= */

    const loadingScreen =
      document.getElementById(
        "loadingScreen"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const rememberMe =
      document.getElementById(
        "rememberMe"
      );


    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    const loginBtnText =
      document.getElementById(
        "loginBtnText"
      );


    const formError =
      document.getElementById(
        "formError"
      );


    const forgotPassword =
      document.getElementById(
        "forgotPassword"
      );


    const toast =
      document.getElementById(
        "toast"
      );


    const toastIcon =
      document.getElementById(
        "toastIcon"
      );


    const toastTitle =
      document.getElementById(
        "toastTitle"
      );


    const toastMessage =
      document.getElementById(
        "toastMessage"
      );


    /* =========================
       HELPERS
    ========================= */

    function hideLoading() {

      loadingScreen.classList.add(
        "hidden"
      );

    }


    function showError(message) {

      formError.textContent =
        message;

      formError.classList.add(
        "show"
      );

    }


    function hideError() {

      formError.textContent = "";

      formError.classList.remove(
        "show"
      );

    }


    function showToast(
      title,
      message,
      type = "success"
    ) {

      toastTitle.textContent =
        title;

      toastMessage.textContent =
        message;


      toast.classList.remove(
        "success",
        "error"
      );


      toast.classList.add(
        type
      );


      toastIcon.textContent =
        type === "error"
          ? "!"
          : "✓";


      toast.classList.remove(
        "show"
      );


      void toast.offsetWidth;


      toast.classList.add(
        "show"
      );


      setTimeout(() => {

        toast.classList.remove(
          "show"
        );

      }, 3500);

    }


    function firebaseErrorMessage(
      error
    ) {

      const code =
        error?.code || "";


      const messages = {

        "auth/invalid-credential":
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

        "auth/invalid-login-credentials":
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

        "auth/wrong-password":
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

        "auth/user-not-found":
          "مفيش حساب مسجل بالبريد الإلكتروني ده.",

        "auth/invalid-email":
          "اكتب بريد إلكتروني صحيح.",

        "auth/user-disabled":
          "الحساب ده تم إيقافه. تواصل مع الإدارة.",

        "auth/too-many-requests":
          "محاولات تسجيل الدخول كتير. حاول مرة تانية بعد شوية.",

        "auth/network-request-failed":
          "مشكلة في الاتصال بالإنترنت. حاول مرة تانية.",

        "auth/internal-error":
          "حصل خطأ داخلي. حاول مرة تانية."

      };


      return (
        messages[code] ||
        "تعذر تسجيل الدخول. تأكد من البيانات وحاول مرة أخرى."
      );

    }


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    passwordToggle.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type ===
          "password";


        passwordInput.type =
          isPassword
            ? "text"
            : "password";


        passwordToggle.textContent =
          isPassword
            ? "◉"
            : "◌";


        passwordToggle.setAttribute(
          "aria-label",
          isPassword
            ? "إخفاء كلمة المرور"
            : "إظهار كلمة المرور"
        );

      }
    );


    /* =========================
       AUTH STATE
    ========================= */

    let checkingAuth = true;


    onAuthStateChanged(
      auth,
      user => {

        if (checkingAuth) {

          checkingAuth = false;

          hideLoading();

        }


        /*
         * لو فيه session موجودة بالفعل،
         * نروح مباشرة للـ dashboard.
         *
         * مفيش أي فحص emailVerified.
         */

        if (user) {

          window.location.replace(
            "./dashboard.html"
          );

        }

      }
    );


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        hideError();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        if (!email) {

          showError(
            "اكتب البريد الإلكتروني."
          );

          emailInput.focus();

          return;

        }


        if (!password) {

          showError(
            "اكتب كلمة المرور."
          );

          passwordInput.focus();

          return;

        }


        if (password.length < 6) {

          showError(
            "كلمة المرور يجب أن تكون 6 أحرف أو أكثر."
          );

          passwordInput.focus();

          return;

        }


        loginBtn.disabled =
          true;


        loginBtnText.innerHTML = `
          <span class="button-loader"></span>
          جاري تسجيل الدخول...
        `;


        try {


          /*
           * اختيار مدة الـ session
           */

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );


          /*
           * تسجيل الدخول
           */

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          /*
           * لا يوجد:
           *
           * emailVerified
           * sendEmailVerification
           * verification redirect
           *
           * الحساب يدخل مباشرة.
           */


          showToast(
            "تم تسجيل الدخول",
            "أهلاً بيك في Mathix."
          );


          setTimeout(() => {

            window.location.replace(
              "./dashboard.html"
            );

          }, 350);


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          showError(
            firebaseErrorMessage(
              error
            )
          );


          loginBtn.disabled =
            false;


          loginBtnText.textContent =
            "تسجيل الدخول";

        }

      }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    forgotPassword.addEventListener(
      "click",
      async () => {

        hideError();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        if (!email) {

          showError(
            "اكتب البريد الإلكتروني الأول، وبعدها اضغط نسيت كلمة المرور."
          );

          emailInput.focus();

          return;

        }


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );


          showToast(
            "تم إرسال الرابط",
            "لو البريد موجود، هيوصلك عليه رابط إعادة تعيين كلمة المرور."
          );


        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );


          showError(
            firebaseErrorMessage(
              error
            )
          );

        }

      }
    );


  </script>

</body>

</html>
