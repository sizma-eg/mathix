<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#050507"
  >

  <meta
    name="description"
    content="Mathix — منصة علمي رياضة"
  >

  <title>تسجيل الدخول | Mathix</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #050507;
      --bg-2: #08080d;

      --surface: rgba(17, 17, 25, .72);
      --surface-2: rgba(25, 24, 36, .82);

      --purple: #8b3dff;
      --purple-2: #a75cff;
      --purple-3: #c28cff;

      --text: #f7f5ff;
      --muted: #94919f;
      --muted-2: #6e6b78;

      --green: #35dc88;
      --red: #ff5870;
      --yellow: #ffc857;

      --border: rgba(255,255,255,.075);
      --border-purple: rgba(139,61,255,.28);

      --shadow: 0 25px 80px rgba(0,0,0,.48);
      --glow: 0 0 50px rgba(139,61,255,.14);

      --radius: 24px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: "Cairo", sans-serif;

      color: var(--text);
      background:
        radial-gradient(
          circle at 90% 5%,
          rgba(139,61,255,.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 95%,
          rgba(139,61,255,.11),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          var(--bg),
          var(--bg-2)
        );
    }

    /* =========================
       GRID BACKGROUND
    ========================= */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 0;

      opacity: .25;

      background-image:
        linear-gradient(
          rgba(255,255,255,.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.025) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image:
        radial-gradient(
          ellipse at center,
          black 20%,
          transparent 85%
        );
    }

    /* =========================
       PURPLE AMBIENT LIGHT
    ========================= */

    .ambient {
      position: fixed;
      width: 420px;
      height: 420px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(139,61,255,.13),
          rgba(139,61,255,.035) 45%,
          transparent 72%
        );

      filter: blur(10px);

      pointer-events: none;
      z-index: 0;
    }

    .ambient.one {
      top: -180px;
      right: -130px;
    }

    .ambient.two {
      bottom: -190px;
      left: -130px;
    }

    /* =========================
       LOADING SCREEN
    ========================= */

    #loadingScreen {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050507;

      transition:
        opacity .35s ease,
        visibility .35s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-box {
      width: min(90%, 340px);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .loading-logo {
      width: 68px;
      height: 68px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      font-family: "Chakra Petch", sans-serif;
      font-size: 32px;
      font-weight: 700;

      color: #fff;

      background:
        linear-gradient(
          145deg,
          rgba(167,92,255,.95),
          rgba(112,42,230,.82)
        );

      border: 1px solid rgba(255,255,255,.1);

      box-shadow:
        0 0 40px rgba(139,61,255,.35),
        inset 0 1px 0 rgba(255,255,255,.18);

      animation: loadingPulse 1.7s ease-in-out infinite;
    }

    .loading-text {
      margin-top: 22px;

      color: var(--text);

      font-size: 14px;
      font-weight: 700;
    }

    .loading-line {
      position: relative;

      width: 150px;
      height: 3px;

      margin-top: 14px;

      overflow: hidden;

      border-radius: 99px;

      background: rgba(255,255,255,.07);
    }

    .loading-line::after {
      content: "";

      position: absolute;
      top: 0;
      right: 0;

      width: 65%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--purple-2),
          var(--purple-3)
        );

      animation: loadingLine 1.25s ease-in-out infinite;
    }

    @keyframes loadingPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 35px rgba(139,61,255,.28),
          inset 0 1px 0 rgba(255,255,255,.18);
      }

      50% {
        transform: scale(1.04);
        box-shadow:
          0 0 55px rgba(139,61,255,.45),
          inset 0 1px 0 rgba(255,255,255,.18);
      }
    }

    @keyframes loadingLine {
      0% {
        transform: translateX(120px);
      }

      100% {
        transform: translateX(-180px);
      }
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      position: relative;
      z-index: 1;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 18px;
    }

    /* =========================
       LOGIN CARD
    ========================= */

    .login-card {
      position: relative;

      width: min(100%, 470px);

      padding: 38px;

      overflow: hidden;

      border-radius: var(--radius);

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(25,24,36,.88),
          rgba(12,12,18,.76)
        );

      box-shadow:
        var(--shadow),
        var(--glow);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      animation: cardIn .55s ease both;
    }

    .login-card::before {
      content: "";

      position: absolute;

      top: -170px;
      right: -160px;

      width: 360px;
      height: 360px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(139,61,255,.20),
          transparent 68%
        );

      pointer-events: none;
    }

    .login-card::after {
      content: "";

      position: absolute;

      left: -100px;
      bottom: -180px;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(139,61,255,.09),
          transparent 70%
        );

      pointer-events: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-content {
      position: relative;
      z-index: 2;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      margin-bottom: 28px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      font-family: "Chakra Petch", sans-serif;
      font-size: 27px;
      font-weight: 700;

      color: white;

      background:
        linear-gradient(
          145deg,
          var(--purple-2),
          #6d25d7
        );

      border: 1px solid rgba(255,255,255,.10);

      box-shadow:
        0 0 32px rgba(139,61,255,.28),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .brand-name {
      font-family: "Chakra Petch", sans-serif;

      font-size: 30px;
      line-height: 1;

      font-weight: 700;
      letter-spacing: -.5px;

      color: #fff;
    }

    .brand-name span {
      color: var(--purple-2);
    }

    /* =========================
       HEADING
    ========================= */

    .heading {
      text-align: center;

      margin-bottom: 28px;
    }

    .heading h1 {
      font-size: 27px;
      line-height: 1.35;

      font-weight: 900;

      color: var(--text);

      margin-bottom: 8px;
    }

    .heading p {
      color: var(--muted);

      font-size: 13px;
      line-height: 1.8;
    }

    /* =========================
       FORM
    ========================= */

    .form {
      display: flex;
      flex-direction: column;

      gap: 17px;
    }

    .field {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 13px;
      font-weight: 700;

      color: #dcd8e7;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 54px;

      padding:
        0 48px
        0 15px;

      outline: none;

      border-radius: var(--radius-sm);

      border: 1px solid var(--border);

      color: var(--text);

      background:
        rgba(5,5,9,.58);

      font-family: "Cairo", sans-serif;
      font-size: 14px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .input::placeholder {
      color: var(--muted-2);
    }

    .input:hover {
      border-color: rgba(255,255,255,.11);
    }

    .input:focus {
      border-color: var(--border-purple);

      background:
        rgba(10,8,17,.72);

      box-shadow:
        0 0 0 3px rgba(139,61,255,.08),
        0 0 30px rgba(139,61,255,.07);
    }

    .input-icon {
      position: absolute;

      top: 50%;
      right: 16px;

      width: 19px;
      height: 19px;

      transform: translateY(-50%);

      color: var(--muted);

      pointer-events: none;
    }

    .password-toggle {
      position: absolute;

      top: 50%;
      left: 14px;

      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translateY(-50%);

      border: 0;
      border-radius: 9px;

      color: var(--muted);

      background: transparent;

      cursor: pointer;

      transition:
        color .2s ease,
        background .2s ease;
    }

    .password-toggle:hover {
      color: var(--purple-3);
      background: rgba(139,61,255,.09);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* =========================
       OPTIONS
    ========================= */

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: -2px;
    }

    .remember {
      display: inline-flex;
      align-items: center;

      gap: 8px;

      color: var(--muted);

      font-size: 12px;

      cursor: pointer;

      user-select: none;
    }

    .remember input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .check {
      width: 18px;
      height: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 6px;

      border: 1px solid rgba(255,255,255,.12);

      background: rgba(255,255,255,.025);

      transition: .2s ease;
    }

    .check svg {
      width: 12px;
      height: 12px;

      opacity: 0;

      transform: scale(.7);

      transition: .2s ease;
    }

    .remember input:checked + .check {
      border-color: var(--purple);

      background: var(--purple);

      box-shadow:
        0 0 15px rgba(139,61,255,.25);
    }

    .remember input:checked + .check svg {
      opacity: 1;
      transform: scale(1);
    }

    .forgot {
      color: var(--purple-3);

      font-size: 12px;
      font-weight: 700;

      text-decoration: none;

      cursor: pointer;

      transition: color .2s ease;
    }

    .forgot:hover {
      color: #d4b5ff;
    }

    /* =========================
       LOGIN BUTTON
    ========================= */

    .login-button {
      position: relative;

      width: 100%;
      height: 54px;

      margin-top: 4px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border: 0;
      border-radius: var(--radius-sm);

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #9a4cff,
          #7028df
        );

      font-family: "Cairo", sans-serif;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      overflow: hidden;

      box-shadow:
        0 14px 32px rgba(111,38,220,.24),
        inset 0 1px 0 rgba(255,255,255,.18);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .login-button::before {
      content: "";

      position: absolute;

      top: 0;
      right: -80px;

      width: 70px;
      height: 100%;

      transform: skewX(-20deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.17),
          transparent
        );

      transition: right .6s ease;
    }

    .login-button:hover {
      transform: translateY(-2px);

      filter: brightness(1.06);

      box-shadow:
        0 18px 40px rgba(111,38,220,.30),
        0 0 35px rgba(139,61,255,.14),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .login-button:hover::before {
      right: 110%;
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      cursor: not-allowed;

      opacity: .72;

      transform: none;
    }

    .button-spinner {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      border: 2px solid rgba(255,255,255,.28);
      border-top-color: #fff;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;
      align-items: center;

      gap: 12px;

      margin: 24px 0 20px;

      color: var(--muted-2);

      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.08)
        );
    }

    .divider::after {
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.08),
          transparent
        );
    }

    /* =========================
       SIGNUP
    ========================= */

    .signup {
      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    .signup a {
      color: var(--purple-3);

      font-weight: 800;

      text-decoration: none;

      transition: color .2s ease;
    }

    .signup a:hover {
      color: #dfc8ff;
    }

    /* =========================
       SECURITY NOTE
    ========================= */

    .security {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-top: 22px;

      color: var(--muted-2);

      font-size: 10px;
    }

    .security svg {
      width: 14px;
      height: 14px;

      color: var(--purple-2);
    }

    /* =========================
       TOAST
    ========================= */

    #toastContainer {
      position: fixed;

      left: 22px;
      bottom: 22px;

      z-index: 10000;

      display: flex;
      flex-direction: column;

      gap: 10px;

      width: min(
        calc(100% - 44px),
        360px
      );

      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: flex-start;

      gap: 11px;

      padding: 13px 14px;

      border-radius: 16px;

      border: 1px solid var(--border);

      background:
        rgba(17,17,25,.92);

      box-shadow:
        0 18px 50px rgba(0,0,0,.35);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      animation: toastIn .3s ease both;

      pointer-events: auto;
    }

    .toast.error {
      border-color: rgba(255,88,112,.22);
    }

    .toast.success {
      border-color: rgba(53,220,136,.22);
    }

    .toast-icon {
      width: 32px;
      height: 32px;

      flex: 0 0 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: rgba(139,61,255,.10);

      color: var(--purple-3);
    }

    .toast.error .toast-icon {
      color: var(--red);
      background: rgba(255,88,112,.09);
    }

    .toast.success .toast-icon {
      color: var(--green);
      background: rgba(53,220,136,.09);
    }

    .toast-icon svg {
      width: 17px;
      height: 17px;
    }

    .toast-content {
      min-width: 0;
      flex: 1;
    }

    .toast-title {
      color: var(--text);

      font-size: 12px;
      font-weight: 800;

      margin-bottom: 2px;
    }

    .toast-message {
      color: var(--muted);

      font-size: 11px;
      line-height: 1.6;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px) translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) translateX(0);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(8px) translateX(-8px);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 560px) {

      .page {
        padding: 18px 12px;
      }

      .login-card {
        padding: 27px 20px;

        border-radius: 21px;
      }

      .brand {
        margin-bottom: 23px;
      }

      .brand-mark {
        width: 47px;
        height: 47px;

        border-radius: 14px;

        font-size: 24px;
      }

      .brand-name {
        font-size: 27px;
      }

      .heading h1 {
        font-size: 23px;
      }

      .heading p {
        font-size: 12px;
      }

      .form {
        gap: 15px;
      }

      .input {
        height: 52px;
      }

      .login-button {
        height: 52px;
      }

      #toastContainer {
        left: 12px;
        bottom: 12px;

        width: calc(100% - 24px);
      }
    }

    @media (max-height: 720px) and (min-width: 561px) {

      .page {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .login-card {
        padding-top: 25px;
        padding-bottom: 25px;
      }

      .brand {
        margin-bottom: 18px;
      }

      .heading {
        margin-bottom: 19px;
      }

      .security {
        margin-top: 14px;
      }
    }

  </style>

</head>

<body>

  <div class="ambient one"></div>
  <div class="ambient two"></div>

  <!-- =========================
       LOADING
  ========================= -->

  <div id="loadingScreen">

    <div class="loading-box">

      <div class="loading-logo">M</div>

      <div class="loading-text">
        جاري تجهيز عالم Mathix...
      </div>

      <div class="loading-line"></div>

    </div>

  </div>

  <!-- =========================
       LOGIN PAGE
  ========================= -->

  <main class="page">

    <section class="login-card">

      <div class="card-content">

        <!-- BRAND -->

        <div class="brand">

          <div class="brand-mark">
            M
          </div>

          <div class="brand-name">
            Mathi<span>x</span>
          </div>

        </div>

        <!-- HEADING -->

        <div class="heading">

          <h1>
            أهلاً بيك 👋
          </h1>

          <p>
            سجل دخولك وكمل رحلتك في Mathix
          </p>

        </div>

        <!-- FORM -->

        <form
          class="form"
          id="loginForm"
          novalidate
        >

          <!-- EMAIL -->

          <div class="field">

            <label
              class="field-label"
              for="email"
            >
              البريد الإلكتروني
            </label>

            <div class="input-wrap">

              <input
                class="input"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="example@gmail.com"
                required
                dir="ltr"
              >

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="3"
                ></rect>

                <path
                  d="m3 7 9 6 9-6"
                ></path>
              </svg>

            </div>

          </div>

          <!-- PASSWORD -->

          <div class="field">

            <label
              class="field-label"
              for="password"
            >
              كلمة المرور
            </label>

            <div class="input-wrap">

              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="اكتب كلمة المرور"
                required
              >

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect
                  x="4"
                  y="10"
                  width="16"
                  height="11"
                  rx="2.5"
                ></rect>

                <path
                  d="M8 10V7a4 4 0 0 1 8 0v3"
                ></path>

                <path
                  d="M12 14v3"
                ></path>
              </svg>

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="إظهار كلمة المرور"
              >

                <svg
                  id="eyeIcon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                  ></path>

                  <circle
                    cx="12"
                    cy="12"
                    r="2.7"
                  ></circle>
                </svg>

              </button>

            </div>

          </div>

          <!-- OPTIONS -->

          <div class="options">

            <label class="remember">

              <input
                type="checkbox"
                id="remember"
                checked
              >

              <span class="check">

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m5 12 4 4L19 6"></path>
                </svg>

              </span>

              تذكرني

            </label>

            <a
              href="#"
              class="forgot"
              id="forgotPassword"
            >
              نسيت كلمة المرور؟
            </a>

          </div>

          <!-- BUTTON -->

          <button
            type="submit"
            class="login-button"
            id="loginButton"
          >

            <span id="loginButtonText">
              تسجيل الدخول
            </span>

          </button>

        </form>

        <!-- DIVIDER -->

        <div class="divider">
          أو
        </div>

        <!-- SIGNUP -->

        <div class="signup">

          لسه معندكش حساب؟
          <a href="./signup.html">
            إنشاء حساب جديد
          </a>

        </div>

        <!-- SECURITY -->

        <div class="security">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect
              x="4"
              y="10"
              width="16"
              height="11"
              rx="2.5"
            ></rect>

            <path
              d="M8 10V7a4 4 0 0 1 8 0v3"
            ></path>

            <path
              d="M12 14v3"
            ></path>
          </svg>

          تسجيل دخول آمن ومشفر

        </div>

      </div>

    </section>

  </main>

  <!-- =========================
       TOASTS
  ========================= -->

  <div id="toastContainer"></div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyCH--HkIXYn3qhXZ9TwRItZrnMOIx_lWXk4",
      authDomain: "mathix-2008.firebaseapp.com",
      projectId: "mathix-2008",
      storageBucket: "mathix-2008.firebasestorage.app",
      messagingSenderId: "561805658834",
      appId: "1:561805658834:web:c1db8ebc2d415be9497b0b",
      measurementId: "G-XWHKQ72FM0"
    };


    /* =========================
       FIREBASE INIT
    ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loadingScreen =
      document.getElementById("loadingScreen");

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const rememberInput =
      document.getElementById("remember");

    const togglePassword =
      document.getElementById("togglePassword");

    const eyeIcon =
      document.getElementById("eyeIcon");

    const loginButton =
      document.getElementById("loginButton");

    const loginButtonText =
      document.getElementById("loginButtonText");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const toastContainer =
      document.getElementById("toastContainer");


    /* =========================
       STATE
    ========================= */

    let authChecked = false;
    let redirecting = false;
    let submitting = false;


    /* =========================
       LOADING
    ========================= */

    function hideLoading() {

      loadingScreen.classList.add("hidden");

    }


    /* =========================
       TOAST
    ========================= */

    function showToast(
      message,
      type = "error",
      title = ""
    ) {

      const toast =
        document.createElement("div");

      toast.className =
        `toast ${type}`;

      let icon = "";

      if (type === "success") {

        icon = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m5 12 4 4L19 6"></path>
          </svg>
        `;

      } else {

        icon = `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle
              cx="12"
              cy="12"
              r="9"
            ></circle>

            <path d="M12 8v5"></path>

            <path d="M12 16h.01"></path>
          </svg>
        `;

      }

      toast.innerHTML = `

        <div class="toast-icon">
          ${icon}
        </div>

        <div class="toast-content">

          ${
            title
              ? `<div class="toast-title">${escapeHTML(title)}</div>`
              : ""
          }

          <div class="toast-message">
            ${escapeHTML(message)}
          </div>

        </div>

      `;

      toastContainer.appendChild(toast);

      setTimeout(() => {

        toast.style.animation =
          "toastOut .25s ease forwards";

        setTimeout(() => {
          toast.remove();
        }, 250);

      }, 4200);

    }


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    togglePassword.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        togglePassword.setAttribute(
          "aria-label",
          isPassword
            ? "إخفاء كلمة المرور"
            : "إظهار كلمة المرور"
        );

        if (isPassword) {

          eyeIcon.innerHTML = `

            <path
              d="M3 3l18 18"
            ></path>

            <path
              d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
            ></path>

            <path
              d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 3.9"
            ></path>

            <path
              d="M6.1 6.1C3.5 8.2 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"
            ></path>

          `;

        } else {

          eyeIcon.innerHTML = `

            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
            ></path>

            <circle
              cx="12"
              cy="12"
              r="2.7"
            ></circle>

          `;

        }

      }
    );


    /* =========================
       AUTH STATE
    ========================= */

    onAuthStateChanged(
      auth,
      (user) => {

        authChecked = true;

        if (user) {

          redirecting = true;

          window.location.replace(
            "./dashboard.html"
          );

          return;

        }

        hideLoading();

        setTimeout(() => {

          if (
            document.visibilityState === "visible" &&
            !redirecting
          ) {
            emailInput.focus();
          }

        }, 100);

      }
    );


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        if (submitting) {
          return;
        }

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email) {

          showToast(
            "اكتب البريد الإلكتروني الأول.",
            "error",
            "بيانات ناقصة"
          );

          emailInput.focus();

          return;
        }

        if (!isValidEmail(email)) {

          showToast(
            "اكتب بريد إلكتروني صحيح.",
            "error",
            "البريد الإلكتروني"
          );

          emailInput.focus();

          return;
        }

        if (!password) {

          showToast(
            "اكتب كلمة المرور.",
            "error",
            "بيانات ناقصة"
          );

          passwordInput.focus();

          return;
        }

        if (password.length < 6) {

          showToast(
            "كلمة المرور غير صحيحة.",
            "error",
            "كلمة المرور"
          );

          passwordInput.focus();

          return;
        }


        submitting = true;

        setLoginLoading(true);


        try {

          const persistence =
            rememberInput.checked
              ? browserLocalPersistence
              : browserSessionPersistence;


          await setPersistence(
            auth,
            persistence
          );


          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          redirecting = true;


          showToast(
            "تم تسجيل الدخول بنجاح.",
            "success",
            "أهلاً بيك في Mathix"
          );


          setTimeout(() => {

            window.location.replace(
              "./dashboard.html"
            );

          }, 250);


        } catch (error) {

          console.error(
            "Mathix login error:",
            error
          );

          setLoginLoading(false);

          submitting = false;

          handleAuthError(error);

        }

      }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();


        if (!email) {

          showToast(
            "اكتب البريد الإلكتروني الأول، وبعدها اضغط نسيت كلمة المرور.",
            "error",
            "استعادة كلمة المرور"
          );

          emailInput.focus();

          return;
        }


        if (!isValidEmail(email)) {

          showToast(
            "البريد الإلكتروني غير صحيح.",
            "error",
            "البريد الإلكتروني"
          );

          emailInput.focus();

          return;
        }


        forgotPassword.style.pointerEvents =
          "none";

        forgotPassword.style.opacity =
          ".55";


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );


          showToast(
            "لو الحساب موجود، هتوصلك رسالة لإعادة تعيين كلمة المرور.",
            "success",
            "تم إرسال الطلب"
          );


        } catch (error) {

          console.error(
            "Mathix password reset error:",
            error
          );

          handleResetError(error);

        } finally {

          setTimeout(() => {

            forgotPassword.style.pointerEvents =
              "";

            forgotPassword.style.opacity =
              "";

          }, 2500);

        }

      }
    );


    /* =========================
       HELPERS
    ========================= */

    function isValidEmail(email) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);

    }


    function setLoginLoading(loading) {

      loginButton.disabled =
        loading;

      if (loading) {

        loginButtonText.innerHTML = `

          <span class="button-spinner"></span>

          جاري تسجيل الدخول...

        `;

      } else {

        loginButtonText.textContent =
          "تسجيل الدخول";

      }

    }


    /* =========================
       AUTH ERRORS
    ========================= */

    function handleAuthError(error) {

      const code =
        error?.code || "";


      if (
        code ===
        "auth/invalid-credential" ||

        code ===
        "auth/invalid-login-credentials" ||

        code ===
        "auth/wrong-password" ||

        code ===
        "auth/user-not-found"
      ) {

        showToast(
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
          "error",
          "تعذر تسجيل الدخول"
        );

        return;

      }


      if (
        code ===
        "auth/too-many-requests"
      ) {

        showToast(
          "محاولات تسجيل دخول كثيرة. استنى شوية وحاول تاني.",
          "error",
          "محاولات كثيرة"
        );

        return;

      }


      if (
        code ===
        "auth/user-disabled"
      ) {

        showToast(
          "الحساب ده متوقف حاليًا. تواصل مع الإدارة.",
          "error",
          "الحساب متوقف"
        );

        return;

      }


      if (
        code ===
        "auth/invalid-email"
      ) {

        showToast(
          "البريد الإلكتروني غير صحيح.",
          "error",
          "بيانات غير صحيحة"
        );

        return;

      }


      if (
        code ===
        "auth/network-request-failed"
      ) {

        showToast(
          "تأكد من اتصالك بالإنترنت وحاول تاني.",
          "error",
          "مشكلة في الاتصال"
        );

        return;

      }


      if (
        code ===
        "auth/operation-not-allowed"
      ) {

        showToast(
          "تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase.",
          "error",
          "إعدادات Firebase"
        );

        return;

      }


      showToast(
        "حصلت مشكلة أثناء تسجيل الدخول. حاول تاني.",
        "error",
        "تعذر تسجيل الدخول"
      );

    }


    /* =========================
       RESET ERRORS
    ========================= */

    function handleResetError(error) {

      const code =
        error?.code || "";


      if (
        code ===
        "auth/invalid-email"
      ) {

        showToast(
          "البريد الإلكتروني غير صحيح.",
          "error",
          "البريد الإلكتروني"
        );

        return;

      }


      if (
        code ===
        "auth/too-many-requests"
      ) {

        showToast(
          "تم إرسال طلبات كثيرة. حاول بعد شوية.",
          "error",
          "محاولات كثيرة"
        );

        return;

      }


      if (
        code ===
        "auth/network-request-failed"
      ) {

        showToast(
          "تأكد من الإنترنت وحاول تاني.",
          "error",
          "مشكلة في الاتصال"
        );

        return;

      }


      showToast(
        "مش قادرين نرسل رابط إعادة تعيين كلمة المرور دلوقتي.",
        "error",
        "تعذر الإرسال"
      );

    }


    /* =========================
       ENTER KEY
    ========================= */

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          loginForm.requestSubmit();

        }

      }
    );


    /* =========================
       GLOBAL SAFETY
    ========================= */

    window.addEventListener(
      "pageshow",
      () => {

        if (
          authChecked &&
          auth.currentUser &&
          !redirecting
        ) {

          redirecting = true;

          window.location.replace(
            "./dashboard.html"
          );

        }

      }
    );

  </script>

</body>

</html>
