<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#050507"
  >

  <meta
    name="description"
    content="تسجيل الدخول إلى Mathix"
  >

  <title>تسجيل الدخول — Mathix</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #050507;
      --bg-2: #08080d;

      --surface: rgba(17, 17, 25, .72);
      --surface-2: rgba(25, 24, 36, .82);

      --purple: #8b3dff;
      --purple-2: #a75cff;
      --purple-3: #c28cff;

      --text: #f7f5ff;
      --muted: #94919f;
      --muted-2: #6e6b78;

      --green: #35dc88;
      --red: #ff5870;
      --yellow: #ffc857;

      --border: rgba(255,255,255,.075);
      --border-purple: rgba(139,61,255,.28);

      --shadow: 0 25px 80px rgba(0,0,0,.48);
      --glow: 0 0 50px rgba(139,61,255,.14);

      --radius: 24px;
      --radius-sm: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 88% 8%,
          rgba(139,61,255,.13),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 92%,
          rgba(139,61,255,.08),
          transparent 26%
        ),
        var(--bg);

      color: var(--text);
      font-family: "Cairo", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
      );

      z-index: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       LOADING
    ========================= */

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(139,61,255,.10),
          transparent 35%
        ),
        #050507;

      transition:
        opacity .45s ease,
        visibility .45s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      width: min(90%, 320px);
      text-align: center;
    }

    .loading-logo {
      width: 68px;
      height: 68px;

      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(167,92,255,.95),
          rgba(101,35,220,.75)
        );

      box-shadow:
        0 0 45px rgba(139,61,255,.35),
        inset 0 1px 0 rgba(255,255,255,.25);

      font-family: "Chakra Petch", sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: white;

      animation: logoPulse 1.8s ease-in-out infinite;
    }

    .loading-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }

    .loading-line {
      width: 100%;
      height: 3px;

      overflow: hidden;
      border-radius: 99px;

      background: rgba(255,255,255,.06);
    }

    .loading-line::after {
      content: "";

      display: block;

      width: 42%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--purple),
          var(--purple-3)
        );

      box-shadow:
        0 0 18px rgba(139,61,255,.7);

      animation: loadingMove 1.2s ease-in-out infinite;
    }

    @keyframes loadingMove {
      0% {
        transform: translateX(-130%);
      }

      100% {
        transform: translateX(330%);
      }
    }

    @keyframes logoPulse {
      0%,
      100% {
        transform: translateY(0);
        box-shadow:
          0 0 45px rgba(139,61,255,.35),
          inset 0 1px 0 rgba(255,255,255,.25);
      }

      50% {
        transform: translateY(-5px);
        box-shadow:
          0 0 65px rgba(139,61,255,.52),
          inset 0 1px 0 rgba(255,255,255,.3);
      }
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      position: relative;
      z-index: 1;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;
    }

    .login-shell {
      width: 100%;
      max-width: 470px;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      margin-bottom: 28px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          var(--purple-2),
          #6320d8
        );

      box-shadow:
        0 0 32px rgba(139,61,255,.28),
        inset 0 1px 0 rgba(255,255,255,.22);

      font-family: "Chakra Petch", sans-serif;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-name {
      direction: ltr;

      font-family: "Chakra Petch", sans-serif;
      font-size: 29px;
      font-weight: 700;

      letter-spacing: -.8px;
    }

    .brand-name span {
      color: var(--purple-2);
    }

    /* =========================
       CARD
    ========================= */

    .login-card {
      position: relative;

      padding: 34px;

      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(22,22,31,.84),
          rgba(11,11,17,.78)
        );

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        var(--shadow),
        0 0 80px rgba(139,61,255,.07);
    }

    .login-card::before {
      content: "";

      position: absolute;

      width: 260px;
      height: 260px;

      top: -170px;
      right: -100px;

      border-radius: 50%;

      background: rgba(139,61,255,.15);

      filter: blur(25px);

      pointer-events: none;
    }

    .login-card::after {
      content: "";

      position: absolute;

      left: 15%;
      right: 15%;
      top: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(167,92,255,.65),
          transparent
        );
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome-badge {
      display: inline-flex;
      align-items: center;

      gap: 7px;

      margin-bottom: 13px;

      padding: 6px 11px;

      border: 1px solid var(--border-purple);
      border-radius: 999px;

      background: rgba(139,61,255,.07);

      color: var(--purple-3);

      font-size: 11px;
      font-weight: 700;
    }

    .welcome-badge-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--purple-2);

      box-shadow:
        0 0 10px rgba(167,92,255,.8);
    }

    .welcome h1 {
      font-size: 27px;
      line-height: 1.45;
      font-weight: 900;

      margin-bottom: 6px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 12px;
      font-weight: 700;
      color: #dcd8e8;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;

      right: 15px;
      top: 50%;

      width: 19px;
      height: 19px;

      transform: translateY(-50%);

      color: var(--muted-2);

      pointer-events: none;

      transition: color .2s ease;
    }

    .form-input {
      width: 100%;
      height: 53px;

      padding: 0 46px 0 15px;

      border: 1px solid var(--border);
      border-radius: 15px;

      outline: none;

      background: rgba(255,255,255,.035);

      color: var(--text);

      font-size: 13px;

      transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .form-input::placeholder {
      color: #5f5c68;
    }

    .form-input:hover {
      border-color: rgba(255,255,255,.11);
    }

    .form-input:focus {
      border-color: rgba(139,61,255,.58);

      background: rgba(139,61,255,.045);

      box-shadow:
        0 0 0 4px rgba(139,61,255,.08);
    }

    .form-input:focus + .input-icon {
      color: var(--purple-2);
    }

    .password-toggle {
      position: absolute;

      left: 13px;
      top: 50%;

      transform: translateY(-50%);

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;

      color: var(--muted-2);

      cursor: pointer;

      border-radius: 8px;

      transition:
        color .2s ease,
        background .2s ease;
    }

    .password-toggle:hover {
      color: var(--text);
      background: rgba(255,255,255,.05);
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 4px;
      margin-bottom: 23px;
    }

    .remember {
      display: flex;
      align-items: center;

      gap: 8px;

      cursor: pointer;

      color: var(--muted);

      font-size: 11px;
    }

    .remember input {
      appearance: none;

      width: 17px;
      height: 17px;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: 5px;

      background: rgba(255,255,255,.03);

      cursor: pointer;

      position: relative;

      transition: .2s ease;
    }

    .remember input:checked {
      border-color: var(--purple);
      background: var(--purple);
    }

    .remember input:checked::after {
      content: "";

      position: absolute;

      width: 5px;
      height: 9px;

      top: 2px;
      left: 5px;

      border:
        solid white;

      border-width:
        0 2px 2px 0;

      transform: rotate(45deg);
    }

    .forgot {
      color: var(--purple-3);

      font-size: 11px;
      font-weight: 700;

      transition: color .2s ease;
    }

    .forgot:hover {
      color: white;
    }

    /* =========================
       BUTTON
    ========================= */

    .login-button {
      position: relative;

      width: 100%;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #9b4cff,
          #7124e5
        );

      color: white;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      overflow: hidden;

      box-shadow:
        0 12px 32px rgba(139,61,255,.24);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .login-button::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.16),
          transparent
        );

      transform: skewX(-20deg);

      transition: left .6s ease;
    }

    .login-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 16px 42px rgba(139,61,255,.34);

      filter: brightness(1.05);
    }

    .login-button:hover::before {
      left: 150%;
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      opacity: .7;
      cursor: not-allowed;
      transform: none;
    }

    .button-spinner {
      width: 18px;
      height: 18px;

      border:
        2px solid rgba(255,255,255,.3);

      border-top-color: white;

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;
      align-items: center;

      gap: 13px;

      margin: 25px 0;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: rgba(255,255,255,.07);
    }

    .divider span {
      color: var(--muted-2);
      font-size: 10px;
      font-weight: 600;
    }

    /* =========================
       SIGNUP
    ========================= */

    .signup {
      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    .signup a {
      color: var(--purple-3);
      font-weight: 800;

      transition: color .2s ease;
    }

    .signup a:hover {
      color: white;
    }

    /* =========================
       SECURITY
    ========================= */

    .security {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-top: 22px;

      color: var(--muted-2);

      font-size: 10px;
    }

    .security svg {
      color: var(--green);
    }

    /* =========================
       TOAST
    ========================= */

    .toast-container {
      position: fixed;

      left: 20px;
      bottom: 20px;

      z-index: 10000;

      display: flex;
      flex-direction: column;

      gap: 10px;

      width: min(360px, calc(100% - 40px));

      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: flex-start;

      gap: 11px;

      padding: 13px 15px;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius: 15px;

      background:
        rgba(18,18,25,.92);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 15px 45px rgba(0,0,0,.35);

      animation:
        toastIn .3s ease forwards;

      pointer-events: auto;
    }

    .toast.error {
      border-color: rgba(255,88,112,.22);
    }

    .toast.success {
      border-color: rgba(53,220,136,.22);
    }

    .toast-icon {
      width: 27px;
      height: 27px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background: rgba(255,255,255,.05);
    }

    .toast.error .toast-icon {
      color: var(--red);
      background: rgba(255,88,112,.08);
    }

    .toast.success .toast-icon {
      color: var(--green);
      background: rgba(53,220,136,.08);
    }

    .toast-text {
      font-size: 11px;
      line-height: 1.7;
      color: #ddd9e7;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {
      .page {
        padding: 20px 14px;
      }

      .login-card {
        padding: 27px 21px;
        border-radius: 21px;
      }

      .brand {
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
      }

      .brand-name {
        font-size: 27px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .welcome p {
        font-size: 12px;
      }

      .form-input {
        height: 51px;
      }

      .login-button {
        height: 52px;
      }

      .toast-container {
        left: 14px;
        bottom: 14px;

        width: calc(100% - 28px);
      }
    }

    @media (max-height: 700px) and (min-width: 601px) {
      .page {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .brand {
        margin-bottom: 16px;
      }

      .login-card {
        padding: 25px 32px;
      }

      .welcome {
        margin-bottom: 19px;
      }

      .form-group {
        margin-bottom: 13px;
      }

      .form-row {
        margin-bottom: 17px;
      }

      .divider {
        margin: 17px 0;
      }

      .security {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOADING SCREEN
  ========================== -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >
    <div class="loading-content">

      <div class="loading-logo">
        M
      </div>

      <div class="loading-title">
        جاري تجهيز عالم Mathix...
      </div>

      <div class="loading-line"></div>

    </div>
  </div>


  <!-- =========================
       PAGE
  ========================== -->

  <main class="page">

    <div class="login-shell">

      <!-- BRAND -->

      <div class="brand">

        <div class="brand-mark">
          M
        </div>

        <div class="brand-name">
          Mathi<span>x</span>
        </div>

      </div>


      <!-- LOGIN CARD -->

      <section class="login-card">

        <div class="card-content">

          <div class="welcome">

            <div class="welcome-badge">

              <span class="welcome-badge-dot"></span>

              منصة علمي رياضة

            </div>

            <h1>
              أهلاً بيك 👋
            </h1>

            <p>
              سجل دخولك وكمل رحلتك في Mathix
            </p>

          </div>


          <!-- FORM -->

          <form id="loginForm">

            <!-- EMAIL -->

            <div class="form-group">

              <label
                class="form-label"
                for="email"
              >
                البريد الإلكتروني
              </label>

              <div class="input-wrap">

                <input
                  id="email"
                  class="form-input"
                  type="email"
                  autocomplete="email"
                  placeholder="example@gmail.com"
                  required
                >

                <svg
                  class="input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="2"
                  ></rect>

                  <path
                    d="m3 7 9 6 9-6"
                  ></path>
                </svg>

              </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

              <label
                class="form-label"
                for="password"
              >
                كلمة المرور
              </label>

              <div class="input-wrap">

                <input
                  id="password"
                  class="form-input"
                  type="password"
                  autocomplete="current-password"
                  placeholder="اكتب كلمة المرور"
                  required
                >

                <svg
                  class="input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect
                    x="5"
                    y="10"
                    width="14"
                    height="10"
                    rx="2"
                  ></rect>

                  <path
                    d="M8 10V7a4 4 0 0 1 8 0v3"
                  ></path>
                </svg>

                <button
                  type="button"
                  class="password-toggle"
                  id="passwordToggle"
                  aria-label="إظهار كلمة المرور"
                >

                  <svg
                    id="eyeIcon"
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                    ></path>

                    <circle
                      cx="12"
                      cy="12"
                      r="2.5"
                    ></circle>
                  </svg>

                </button>

              </div>

            </div>


            <!-- OPTIONS -->

            <div class="form-row">

              <label class="remember">

                <input
                  type="checkbox"
                  id="remember"
                  checked
                >

                <span>
                  تذكرني
                </span>

              </label>

              <a
                href="#"
                class="forgot"
                id="forgotPassword"
              >
                نسيت كلمة المرور؟
              </a>

            </div>


            <!-- BUTTON -->

            <button
              type="submit"
              class="login-button"
              id="loginButton"
            >

              <span id="loginButtonText">
                تسجيل الدخول
              </span>

            </button>

          </form>


          <!-- DIVIDER -->

          <div class="divider">
            <span>أو</span>
          </div>


          <!-- SIGNUP -->

          <div class="signup">

            لسه معندكش حساب؟

            <a href="./signup.html">
              إنشاء حساب جديد
            </a>

          </div>


          <!-- SECURITY -->

          <div class="security">

            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"
              ></path>

              <path
                d="m9 12 2 2 4-4"
              ></path>
            </svg>

            تسجيل دخول آمن ومحمي بواسطة Firebase

          </div>

        </div>

      </section>

    </div>

  </main>


  <!-- TOAST -->

  <div
    class="toast-container"
    id="toastContainer"
  ></div>


  <!-- =========================
       FIREBASE
  ========================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCH--HkIXYn3qhXZ9TwRItZrnMOIx_lWXk",

      authDomain:
        "mathix-2008.firebaseapp.com",

      projectId:
        "mathix-2008",

      storageBucket:
        "mathix-2008.firebasestorage.app",

      messagingSenderId:
        "561805658834",

      appId:
        "1:561805658834:web:c1db8ebc2d415be9497b0b",

      measurementId:
        "G-XWHKQ72FM0"

    };


    /* =========================
       INIT
    ========================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* =========================
       ELEMENTS
    ========================== */

    const loadingScreen =
      document.getElementById("loadingScreen");

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const rememberInput =
      document.getElementById("remember");

    const loginButton =
      document.getElementById("loginButton");

    const loginButtonText =
      document.getElementById("loginButtonText");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const eyeIcon =
      document.getElementById("eyeIcon");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const toastContainer =
      document.getElementById("toastContainer");


    /* =========================
       STATE
    ========================== */

    let authChecked = false;
    let redirecting = false;
    let submitting = false;


    /* =========================
       TOAST
    ========================== */

    function showToast(
      message,
      type = "error"
    ) {

      const toast =
        document.createElement("div");

      toast.className =
        `toast ${type}`;

      const icon =
        type === "success"
          ? `
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m5 12 4 4L19 6"></path>
            </svg>
          `
          : `
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle
                cx="12"
                cy="12"
                r="9"
              ></circle>

              <path d="M12 8v4"></path>

              <path d="M12 16h.01"></path>
            </svg>
          `;

      toast.innerHTML = `

        <div class="toast-icon">
          ${icon}
        </div>

        <div class="toast-text">
          ${escapeHTML(message)}
        </div>

      `;

      toastContainer.appendChild(toast);

      setTimeout(() => {

        toast.style.opacity = "0";
        toast.style.transform =
          "translateY(10px)";

        toast.style.transition =
          "opacity .25s ease, transform .25s ease";

        setTimeout(() => {
          toast.remove();
        }, 250);

      }, 4000);
    }


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================
       AUTH STATE
    ========================== */

    onAuthStateChanged(
      auth,
      (user) => {

        authChecked = true;

        if (user) {

          redirecting = true;

          window.location.replace(
            "./dashboard.html"
          );

          return;
        }

        loadingScreen.classList.add("hidden");

        setTimeout(() => {

          emailInput.focus();

        }, 250);
      }
    );


    /* =========================
       PASSWORD TOGGLE
    ========================== */

    passwordToggle.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        passwordToggle.setAttribute(
          "aria-label",
          isPassword
            ? "إخفاء كلمة المرور"
            : "إظهار كلمة المرور"
        );

        if (isPassword) {

          eyeIcon.innerHTML = `
            <path
              d="M3 3l18 18"
            ></path>

            <path
              d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
            ></path>

            <path
              d="M9.9 4.3A10.8 10.8 0 0 1 12 4c6 0 9.5 8 9.5 8a17.4 17.4 0 0 1-3.2 4.2"
            ></path>

            <path
              d="M6.1 6.1C3.7 7.7 2.5 12 2.5 12s3.5 8 9.5 8c1.6 0 3-.4 4.2-1"
            ></path>
          `;

        } else {

          eyeIcon.innerHTML = `
            <path
              d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
            ></path>

            <circle
              cx="12"
              cy="12"
              r="2.5"
            ></circle>
          `;
        }
      }
    );


    /* =========================
       LOGIN
    ========================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        if (submitting || redirecting) {
          return;
        }

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email) {

          showToast(
            "اكتب البريد الإلكتروني أولاً."
          );

          emailInput.focus();

          return;
        }

        if (!password) {

          showToast(
            "اكتب كلمة المرور أولاً."
          );

          passwordInput.focus();

          return;
        }

        submitting = true;

        loginButton.disabled = true;

        loginButtonText.innerHTML = `
          <span class="button-spinner"></span>
          جاري تسجيل الدخول...
        `;

        try {

          await setPersistence(
            auth,
            rememberInput.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          showToast(
            "تم تسجيل الدخول بنجاح.",
            "success"
          );

          loginButtonText.textContent =
            "تم الدخول ✓";

          redirecting = true;

          setTimeout(() => {

            window.location.replace(
              "./dashboard.html"
            );

          }, 400);

        } catch (error) {

          console.error(
            "Login error:",
            error
          );

          submitting = false;

          loginButton.disabled = false;

          loginButtonText.textContent =
            "تسجيل الدخول";

          handleAuthError(error);
        }
      }
    );


    /* =========================
       PASSWORD RESET
    ========================== */

    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        if (!email) {

          showToast(
            "اكتب بريدك الإلكتروني أولاً، وبعدها اضغط نسيت كلمة المرور."
          );

          emailInput.focus();

          return;
        }

        try {

          await sendPasswordResetEmail(
            auth,
            email
          );

          showToast(
            "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.",
            "success"
          );

        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );

          handleAuthError(error);
        }
      }
    );


    /* =========================
       AUTH ERRORS
    ========================== */

    function handleAuthError(error) {

      const code =
        error?.code || "";

      let message =
        "حصل خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";

      switch (code) {

        case "auth/invalid-credential":

        case "auth/wrong-password":

        case "auth/user-not-found":

          message =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

          break;


        case "auth/invalid-email":

          message =
            "البريد الإلكتروني غير صحيح.";

          break;


        case "auth/user-disabled":

          message =
            "هذا الحساب تم تعطيله.";

          break;


        case "auth/too-many-requests":

          message =
            "تمت محاولات كثيرة. حاول مرة أخرى بعد قليل.";

          break;


        case "auth/network-request-failed":

          message =
            "تأكد من اتصال الإنترنت وحاول مرة أخرى.";

          break;


        case "auth/operation-not-allowed":

          message =
            "تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase.";

          break;


        case "auth/api-key-not-valid":

        case "auth/invalid-api-key":

          message =
            "مفتاح Firebase غير صحيح. تأكد من إعدادات المشروع.";

          break;


        case "auth/internal-error":

          message =
            "حدث خطأ داخلي في Firebase. حاول مرة أخرى.";

          break;


        default:

          if (
            String(error?.message || "")
              .toLowerCase()
              .includes("api key")
          ) {

            message =
              "مفتاح Firebase غير صحيح أو غير مفعّل.";
          }

          break;
      }

      showToast(message);
    }


    /* =========================
       PAGE SHOW SAFETY
    ========================== */

    window.addEventListener(
      "pageshow",
      () => {

        if (
          auth.currentUser &&
          !redirecting
        ) {

          redirecting = true;

          window.location.replace(
            "./dashboard.html"
          );
        }
      }
    );

  </script>

</body>

</html>
