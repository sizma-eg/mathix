
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#050507"
  >

  <meta
    name="description"
    content="تسجيل الدخول إلى منصة Mathix"
  >

  <title>تسجيل الدخول | Mathix</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #050507;
      --bg-2: #08080d;

      --surface: rgba(17, 17, 25, 0.72);
      --surface-2: rgba(23, 23, 34, 0.78);

      --purple: #8b3dff;
      --purple-2: #a75cff;
      --purple-3: #c28cff;

      --text: #f7f5ff;
      --muted: #94919f;

      --border: rgba(255, 255, 255, 0.075);

      --danger: #ff5577;

      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family: "Cairo", sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(139, 61, 255, 0.13),
          transparent 34%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(104, 43, 190, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(167, 92, 255, 0.06),
          transparent 25%
        ),
        linear-gradient(
          145deg,
          var(--bg),
          var(--bg-2)
        );

      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;

      pointer-events: none;

      overflow: hidden;
      z-index: 0;
    }

    .grid {
      position: absolute;
      inset: -50%;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      transform: perspective(700px) rotateX(55deg);

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 25%,
        black 70%,
        transparent
      );

      opacity: 0.35;
    }

    .orb {
      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      filter: blur(90px);

      opacity: 0.12;
    }

    .orb-one {
      top: -200px;
      right: -150px;
      background: var(--purple);
    }

    .orb-two {
      bottom: -240px;
      left: -180px;
      background: #6123bd;
    }

    /* =========================
       LOADING
    ========================= */

    .loading-screen {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050507;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .loader-logo {
      width: 78px;
      height: 78px;

      object-fit: contain;

      filter:
        drop-shadow(0 0 20px rgba(139, 61, 255, 0.35));

      animation: logoPulse 1.7s ease-in-out infinite;
    }

    .loader-ring {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      border:
        2px solid rgba(255, 255, 255, 0.08);

      border-top-color: var(--purple-2);

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.75;
      }

      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      position: relative;

      z-index: 1;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 18px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;

      margin-bottom: 25px;

      text-align: center;
    }

    .logo-wrap {
      position: relative;

      width: 84px;
      height: 84px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 14px;
    }

    .logo-wrap::before {
      content: "";

      position: absolute;
      inset: 5px;

      border-radius: 24px;

      background:
        radial-gradient(
          circle,
          rgba(139, 61, 255, 0.18),
          transparent 70%
        );

      filter: blur(10px);
    }

    .logo {
      position: relative;

      width: 72px;
      height: 72px;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 18px rgba(139, 61, 255, 0.25)
        );
    }

    .brand-name {
      font-family: "Chakra Petch", sans-serif;

      font-size: 28px;
      font-weight: 700;

      letter-spacing: 2px;

      color: #ffffff;
    }

    .brand-name span {
      color: var(--purple-2);
    }

    .brand-subtitle {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      position: relative;

      padding: 31px;

      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(22, 22, 32, 0.86),
          rgba(10, 10, 15, 0.88)
        );

      border: 1px solid var(--border);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(167, 92, 255, 0.75),
          transparent
        );

      opacity: 0.75;
    }

    .card-glow {
      position: absolute;

      width: 180px;
      height: 180px;

      top: -110px;
      right: -100px;

      border-radius: 50%;

      background: var(--purple);

      filter: blur(90px);

      opacity: 0.08;

      pointer-events: none;
    }

    .heading {
      position: relative;

      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 22px;
      font-weight: 800;

      margin-bottom: 5px;
    }

    .heading p {
      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 600;

      color: #d9d6e4;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;

      height: 54px;

      padding:
        0 16px;

      border:
        1px solid rgba(255, 255, 255, 0.08);

      border-radius: 14px;

      outline: none;

      color: var(--text);

      background:
        rgba(5, 5, 8, 0.68);

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .input::placeholder {
      color: #666372;
    }

    .input:focus {
      border-color:
        rgba(139, 61, 255, 0.65);

      background:
        rgba(8, 8, 13, 0.9);

      box-shadow:
        0 0 0 4px rgba(139, 61, 255, 0.08),
        0 0 25px rgba(139, 61, 255, 0.05);
    }

    .password-input {
      padding-left: 52px;
    }

    .toggle-password {
      position: absolute;

      left: 8px;
      top: 50%;

      width: 38px;
      height: 38px;

      transform: translateY(-50%);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      color: #777382;

      background: transparent;

      border-radius: 10px;

      transition:
        color 0.2s ease,
        background 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--purple-3);

      background:
        rgba(139, 61, 255, 0.08);
    }

    .toggle-password svg {
      width: 19px;
      height: 19px;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      display: none;

      align-items: flex-start;

      gap: 10px;

      margin-bottom: 17px;

      padding: 12px 13px;

      border-radius: 12px;

      border:
        1px solid rgba(255, 85, 119, 0.18);

      background:
        rgba(255, 85, 119, 0.06);

      color: #ff9ab0;

      font-size: 12px;

      line-height: 1.7;
    }

    .error-box.show {
      display: flex;
    }

    .error-icon {
      flex-shrink: 0;

      width: 20px;
      height: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255, 85, 119, 0.12);

      color: #ff6688;

      font-weight: 800;
    }

    /* =========================
       SUBMIT
    ========================= */

    .submit-btn {
      position: relative;

      width: 100%;
      height: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      margin-top: 4px;

      border-radius: 14px;

      cursor: pointer;

      color: #ffffff;

      font-size: 14px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #7c32ed,
          #a04cff
        );

      box-shadow:
        0 12px 30px rgba(139, 61, 255, 0.22);

      overflow: hidden;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .submit-btn::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          110deg,
          transparent 25%,
          rgba(255, 255, 255, 0.14) 50%,
          transparent 75%
        );

      transform: translateX(120%);

      transition: transform 0.6s ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);

      box-shadow:
        0 16px 38px rgba(139, 61, 255, 0.3);
    }

    .submit-btn:hover:not(:disabled)::before {
      transform: translateX(-120%);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .btn-loader {
      display: none;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      border:
        2px solid rgba(255, 255, 255, 0.3);

      border-top-color: #ffffff;

      animation: spin 0.7s linear infinite;
    }

    .submit-btn.loading .btn-text {
      display: none;
    }

    .submit-btn.loading .btn-loader {
      display: block;
    }

    /* =========================
       SIGNUP
    ========================= */

    .signup {
      margin-top: 22px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;
    }

    .signup a {
      color: var(--purple-3);

      font-weight: 700;

      transition: color 0.2s ease;
    }

    .signup a:hover {
      color: #ffffff;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 18px;

      text-align: center;

      color: #55525f;

      font-size: 11px;
    }

    .footer span {
      font-family: "Chakra Petch", sans-serif;

      color: #706b7a;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 520px) {
      .page {
        padding:
          24px 14px;
      }

      .card {
        padding: 24px 19px;
        border-radius: 20px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .logo-wrap {
        width: 72px;
        height: 72px;
      }

      .logo {
        width: 62px;
        height: 62px;
      }

      .brand-name {
        font-size: 25px;
      }

      .heading h1 {
        font-size: 20px;
      }

      .input,
      .submit-btn {
        height: 53px;
      }
    }

    @media (max-height: 700px) and (min-width: 521px) {
      .page {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .brand {
        margin-bottom: 14px;
      }

      .logo-wrap {
        width: 62px;
        height: 62px;
        margin-bottom: 7px;
      }

      .logo {
        width: 55px;
        height: 55px;
      }

      .card {
        padding-top: 24px;
        padding-bottom: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH LOADING
  ========================== -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div class="loader-content">

      <img
        src="./logo.png"
        alt="Mathix"
        class="loader-logo"
      >

      <div class="loader-ring"></div>

    </div>

  </div>


  <!-- =========================
       BACKGROUND
  ========================== -->

  <div class="background">

    <div class="grid"></div>

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>

  </div>


  <!-- =========================
       PAGE
  ========================== -->

  <main class="page">

    <div class="container">

      <!-- BRAND -->

      <div class="brand">

        <div class="logo-wrap">

          <img
            src="./logo.png"
            alt="Mathix Logo"
            class="logo"
          >

        </div>

        <div class="brand-name">
          MATH<span>IX</span>
        </div>

        <div class="brand-subtitle">
          منصتك الذكية للتفوق
        </div>

      </div>


      <!-- LOGIN CARD -->

      <section class="card">

        <div class="card-glow"></div>

        <div class="heading">

          <h1>
            تسجيل الدخول
          </h1>

          <p>
            ادخل على حسابك وكمل رحلتك مع Mathix.
          </p>

        </div>


        <!-- ERROR -->

        <div
          class="error-box"
          id="errorBox"
          role="alert"
        >

          <div class="error-icon">
            !
          </div>

          <div id="errorText"></div>

        </div>


        <!-- FORM -->

        <form
          id="loginForm"
          novalidate
        >

          <!-- EMAIL -->

          <div class="form-group">

            <label
              class="form-label"
              for="email"
            >
              البريد الإلكتروني
            </label>

            <div class="input-wrap">

              <input
                class="input"
                id="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="example@gmail.com"
                required
              >

            </div>

          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <label
              class="form-label"
              for="password"
            >
              كلمة المرور
            </label>

            <div class="input-wrap">

              <input
                class="input password-input"
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="اكتب كلمة المرور"
                required
              >

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="إظهار كلمة المرور"
                title="إظهار كلمة المرور"
              >

                <svg
                  id="eyeIcon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="2.7"
                  />
                </svg>

              </button>

            </div>

          </div>


          <!-- SUBMIT -->

          <button
            type="submit"
            class="submit-btn"
            id="loginButton"
          >

            <span class="btn-text">
              تسجيل الدخول
            </span>

            <span
              class="btn-loader"
              aria-hidden="true"
            ></span>

          </button>

        </form>


        <!-- SIGNUP -->

        <div class="signup">

          مش عندك حساب؟

          <a href="./signup.html">
            إنشاء حساب جديد
          </a>

        </div>

      </section>


      <div class="footer">
        <span>Mathix</span>
        — Learn smarter.
      </div>

    </div>

  </main>


  <!-- =========================
       FIREBASE AUTH
  ========================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCH--HkIXYn3qhXZ9TwRItZrnMOIx_lWXk4",

      authDomain:
        "mathix-2008.firebaseapp.com",

      projectId:
        "mathix-2008",

      storageBucket:
        "mathix-2008.firebasestorage.app",

      messagingSenderId:
        "561805658834",

      appId:
        "1:561805658834:web:c1db8ebc2d415be9497b0b",

      measurementId:
        "G-XWHKQ72FM0"

    };


    /* =========================
       FIREBASE
    ========================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* =========================
       ELEMENTS
    ========================== */

    const loadingScreen =
      document.getElementById("loadingScreen");

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const togglePassword =
      document.getElementById("togglePassword");

    const eyeIcon =
      document.getElementById("eyeIcon");

    const errorBox =
      document.getElementById("errorBox");

    const errorText =
      document.getElementById("errorText");


    /* =========================
       STATE
    ========================== */

    let redirecting = false;

    let authStateResolved = false;


    /* =========================
       HELPERS
    ========================== */

    function hideLoading() {

      loadingScreen.classList.add("hidden");

    }


    function showError(message) {

      errorText.textContent = message;

      errorBox.classList.add("show");

    }


    function hideError() {

      errorBox.classList.remove("show");

      errorText.textContent = "";

    }


    function setButtonLoading(isLoading) {

      loginButton.disabled = isLoading;

      loginButton.classList.toggle(
        "loading",
        isLoading
      );

    }


    function goToDashboard() {

      if (redirecting) {
        return;
      }

      redirecting = true;

      window.location.replace(
        "./dashboard.html"
      );

    }


    function getAuthErrorMessage(error) {

      const code =
        error?.code || "";

      switch (code) {

        case "auth/invalid-credential":

        case "auth/wrong-password":

        case "auth/user-not-found":

          return "الإيميل أو كلمة المرور غير صحيحة.";


        case "auth/invalid-email":

          return "اكتب إيميل صحيح.";


        case "auth/user-disabled":

          return "الحساب ده متوقف.";


        case "auth/too-many-requests":

          return "محاولات كتير. حاول تاني بعد شوية.";


        case "auth/network-request-failed":

          return "مفيش اتصال بالإنترنت.";


        case "auth/operation-not-allowed":

          return "تسجيل الدخول بالإيميل غير متاح حاليًا.";


        default:

          return "حصل خطأ أثناء تسجيل الدخول. حاول تاني.";

      }

    }


    /* =========================
       AUTH PERSISTENCE
    ========================== */

    async function prepareAuth() {

      try {

        await setPersistence(
          auth,
          browserLocalPersistence
        );

      } catch (error) {

        console.error(
          "Auth persistence error:",
          error
        );

      }

    }


    /* =========================
       AUTH STATE
    ========================== */

    async function startAuth() {

      await prepareAuth();


      onAuthStateChanged(
        auth,
        user => {

          authStateResolved = true;


          if (redirecting) {
            return;
          }


          if (user) {

            goToDashboard();

            return;

          }


          hideLoading();

        }
      );

    }


    startAuth();


    /* =========================
       PASSWORD VISIBILITY
    ========================== */

    togglePassword.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";


        passwordInput.type =
          isPassword
            ? "text"
            : "password";


        togglePassword.setAttribute(
          "aria-label",
          isPassword
            ? "إخفاء كلمة المرور"
            : "إظهار كلمة المرور"
        );


        togglePassword.setAttribute(
          "title",
          isPassword
            ? "إخفاء كلمة المرور"
            : "إظهار كلمة المرور"
        );


        eyeIcon.innerHTML =
          isPassword

            ? `
              <path
                d="M3 3l18 18"
              />
              <path
                d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
              />
              <path
                d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a18 18 0 0 1-3.1 3.8"
              />
              <path
                d="M6.1 6.1C3.7 7.7 2.5 12 2.5 12s3.5 6 9.5 6a10.5 10.5 0 0 0 3-.45"
              />
            `

            : `
              <path
                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
              />
              <circle
                cx="12"
                cy="12"
                r="2.7"
              />
            `;

      }
    );


    /* =========================
       INPUT EVENTS
    ========================== */

    emailInput.addEventListener(
      "input",
      hideError
    );

    passwordInput.addEventListener(
      "input",
      hideError
    );


    /* =========================
       LOGIN
    ========================== */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        if (redirecting) {
          return;
        }


        hideError();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email) {

          showError(
            "اكتب البريد الإلكتروني."
          );

          emailInput.focus();

          return;

        }


        if (!password) {

          showError(
            "اكتب كلمة المرور."
          );

          passwordInput.focus();

          return;

        }


        setButtonLoading(true);


        try {

          await prepareAuth();


          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          /*
            لا يوجد redirect هنا.
            onAuthStateChanged هو المسؤول
            عن تحويل المستخدم إلى dashboard.html.
          */

        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          setButtonLoading(false);


          showError(
            getAuthErrorMessage(error)
          );

        }

      }
    );

  </script>

</body>

</html>
