<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة التحكم | Mathix</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./logo.png">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./dashboard.html">Math<span class="ix">ix</span></a>
      <div class="account">
        <span id="adminEmail"></span>
        <button class="btn btn-secondary" id="logoutBtn">خروج</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">إدارة المنصة</div>
      <a class="nav-btn active" href="./dashboard.html">📊 الرئيسية</a>
      <a class="nav-btn" href="./revisions.html">📚 الملخصات</a>
      <a class="nav-btn" href="./wallet-requests.html">💳 طلبات الشحن</a>
      <a class="nav-btn" href="./wallets.html">👛 المحافظ</a>
      <a class="nav-btn" href="./purchases.html">🧾 المشتريات</a>
      <a class="nav-btn" href="./students.html">🎓 الطلاب</a>
      <a class="nav-btn" href="./settings.html">⚙️ الإعدادات</a>
    </aside>

    <main class="main">
      <section class="page-head">
        <div>
          <h1>نظرة عامة</h1>
          <p>إحصائيات المنصة وطلبات الشحن الأخيرة.</p>
        </div>
        <button class="btn btn-secondary" id="refreshBtn">تحديث ↻</button>
      </section>

      <div class="stats">
        <div class="stat"><div class="stat-label">الملخصات</div><div class="stat-value purple" id="revisionCount">—</div></div>
        <div class="stat"><div class="stat-label">طلبات الشحن المعلقة</div><div class="stat-value yellow" id="requestCount">—</div></div>
        <div class="stat"><div class="stat-label">المشتريات</div><div class="stat-value green" id="purchaseCount">—</div></div>
        <div class="stat"><div class="stat-label">الطلاب</div><div class="stat-value" id="studentCount">—</div></div>
      </div>

      <section class="panel">
        <h2>آخر طلبات الشحن</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>الطالب</th><th>المبلغ</th><th>الحالة</th></tr></thead>
            <tbody id="requestsTable"><tr><td colspan="3">جارٍ التحميل...</td></tr></tbody>
          </table>
        </div>
      </section>

      <div class="notice" id="notice"></div>
    </main>
  </div>

  <script type="module" src="./dashboard-page.js"></script>
</body>
</html>
