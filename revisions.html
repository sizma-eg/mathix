<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#09090f"><title>Mathix | الملخصات</title><link rel="icon" href="../logo.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080d;--panel:#11111a;--line:#29283a;--purple:#9b5cff;--purple2:#7138dc;--text:#f5f3fb;--muted:#a5a1b7;--green:#48d7a0;--red:#ff647c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#251342 0,transparent 38%),var(--bg);color:var(--text);font-family:Cairo,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.top{height:76px;border-bottom:1px solid #ffffff12;background:#09090fdd;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 max(5%,calc((100% - 1200px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font:700 25px 'Chakra Petch',sans-serif;direction:ltr}.brand img{width:39px;height:39px;object-fit:contain;animation:float 3s ease-in-out infinite}.brand span{color:#fff}.brand b{color:var(--purple)}@keyframes float{50%{transform:translateY(-5px)}}.nav{display:flex;gap:10px;align-items:center}.nav a,.nav button{border:1px solid var(--line);background:#ffffff06;color:var(--text);padding:9px 14px;border-radius:12px;font-size:13px}.wrap{max-width:1150px;margin:auto;padding:34px 22px 70px}.back{color:#c7a6ff;font-size:13px;font-weight:700}.hero{margin:18px 0 25px}.eyebrow{color:#c5a6ff;font-size:12px;font-weight:800}.hero h1{font-size:clamp(28px,4vw,40px);margin:7px 0;line-height:1.3}.hero p{color:var(--muted);margin:0;font-size:14px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.search,.select{background:#101019;border:1px solid var(--line);color:white;border-radius:13px;padding:12px 14px;outline:none;font:inherit}.search{flex:1;min-width:180px}.select:focus,.search:focus{border-color:var(--purple)}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#171722,#0f0f17);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}.item-head{display:flex;align-items:start;gap:13px}.fileicon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#9b5cff1b;color:#d6c0ff;border:1px solid #9b5cff3b;font-size:21px;flex-shrink:0}.item h2{font-size:17px;margin:0 0 4px;overflow-wrap:anywhere}.item p{font-size:12px;color:var(--muted);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 9px;border-radius:30px;background:#ffffff08;border:1px solid #ffffff12;color:#c9c4d7}.tag.free{color:var(--green);border-color:#48d7a044;background:#48d7a00d}.tag.paid{color:#e0c5ff;border-color:#9b5cff55;background:#9b5cff12}.actions{display:flex;gap:9px;margin-top:auto;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#ffffff08;color:white;font-size:12px;font-weight:800}.btn.primary{border:0;background:linear-gradient(135deg,var(--purple),var(--purple2))}.btn:disabled{opacity:.55;cursor:not-allowed}.state{padding:34px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);grid-column:1/-1}.state strong{display:block;color:white;font-size:18px;margin-bottom:7px}.toast{position:fixed;bottom:20px;left:20px;z-index:20;background:#1c1b28;border:1px solid var(--line);border-radius:12px;padding:13px 16px;max-width:calc(100% - 40px);display:none}.toast.show{display:block}.modal{position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:min(460px,100%);border:1px solid #ffffff20;border-radius:22px;background:#12121c;padding:24px;box-shadow:0 20px 70px #0009}.modal-box h2{margin:0 0 8px;font-size:21px}.modal-box p{color:var(--muted);font-size:13px;line-height:1.9}.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}.footer{text-align:center;color:#716c82;font-size:12px;margin-top:35px}@media(max-width:680px){.list{grid-template-columns:1fr}.top{padding:0 15px;height:66px}.brand{font-size:22px}.brand img{width:32px;height:32px}.nav a,.nav button{font-size:11px;padding:8px 10px}.wrap{padding:25px 15px 50px}}
</style></head><body>
<header class="top"><a class="brand" href="../dashboard.html"><img src="../logo.png" alt="Mathix"><span>Math<b>ix</b></span></a><nav class="nav"><a href="../dashboard.html">لوحة الطالب</a><a href="../subjects.html">المواد</a><a href="../wallet.html">المحفظة</a><button id="logoutBtn" type="button">خروج</button></nav></header>
<main class="wrap"><a class="back" href="../subjects.html">← الرجوع للمواد</a><section class="hero"><div class="eyebrow">STUDY SMARTER</div><h1 id="pageTitle">الملخصات <span style="color:var(--purple)">.</span></h1><p>ملخصات منظمة تساعدك تراجع المنهج. المحتوى المدفوع يحتاج رصيد كافي في محفظتك.</p></section><div class="filters"><input class="search" id="searchInput" type="search" placeholder="ابحث عن ملخص..." autocomplete="off"><select class="select" id="typeFilter"><option value="all">كل الأنواع</option><option value="pdf">PDF</option><option value="link">رابط خارجي</option><option value="youtube">YouTube</option></select></div><section class="list" id="summaryList"><div class="state"><strong>جاري تحميل الملخصات...</strong>لحظة واحدة</div></section><div class="footer">Mathix © 2026</div></main>
<div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box"><h2 id="modalTitle">تأكيد شراء الملخص</h2><p id="modalText"></p><div class="modal-actions"><button class="btn primary" id="confirmBuy">تأكيد الشراء</button><button class="btn" id="cancelBuy">إلغاء</button></div></div></div><div class="toast" id="toast" role="status"></div>
<script type="module">
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, doc, getDoc, getDocs, onSnapshot, query, where, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { auth, db } from '../firebase-config.js';
const list=document.querySelector('#summaryList'), search=document.querySelector('#searchInput'), filter=document.querySelector('#typeFilter'), toast=document.querySelector('#toast'), modal=document.querySelector('#confirmModal');const params=new URLSearchParams(location.search);const subjectId=params.get('subject');let userNow=null,items=[],subjectName='',walletBalance=0,pending=null,owned=new Set(),stopWallet=null;
function say(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3500)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return `${Number(n||0).toLocaleString('ar-EG')} ج.م`}function normalizedType(x){let t=String(x||'').toLowerCase();if(t.includes('pdf'))return'pdf';if(t.includes('youtube')||t==='video'||t==='yt')return'youtube';return'link'}function urlOf(x){return x.url||x.link||x.contentUrl||x.fileUrl||''}
function render(){const term=search.value.trim().toLocaleLowerCase('ar'),typ=filter.value;const shown=items.filter(x=>(x.title||x.name||'').toLocaleLowerCase('ar').includes(term)&&(typ==='all'||normalizedType(x.type)===typ));if(!shown.length){list.innerHTML='<div class="state"><strong>مفيش ملخصات ظاهرة هنا لسه</strong>جرّب تغيّر البحث أو ارجع لاحقًا بعد إضافة المحتوى.</div>';return}list.innerHTML=shown.map(x=>{const id=x.id,title=x.title||x.name||'ملخص بدون عنوان',type=normalizedType(x.type),price=Number(x.price||0),free=x.isFree===true||x.free===true||price<=0,ownedNow=owned.has(id),icon=type==='pdf'?'▤':type==='youtube'?'▶':'↗',typeLabel=type==='pdf'?'ملف PDF':type==='youtube'?'فيديو YouTube':'رابط خارجي';let action=free||ownedNow?`<button class="btn primary" data-open="${esc(id)}">${ownedNow?'فتح الملخص':'عرض المحتوى'} ←</button>`:`<button class="btn primary" data-buy="${esc(id)}">شراء الملخص · ${money(price)}</button>`;return `<article class="item"><div class="item-head"><div class="fileicon">${icon}</div><div><h2>${esc(title)}</h2><p>${esc(x.description||x.details||'ملخص للمراجعة والمذاكرة.')}</p></div></div><div class="meta"><span class="tag">${typeLabel}</span><span class="tag ${free||ownedNow?'free':'paid'}">${ownedNow?'تم الشراء':free?'مجاني':money(price)}</span></div><div class="actions">${action}</div></article>`}).join('');list.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openItem(b.dataset.open)));list.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>beginBuy(b.dataset.buy)))}
async function loadOwned(){owned.clear();const snap=await getDocs(query(collection(db,'purchases'),where('studentId','==',userNow.uid)));snap.docs.forEach(d=>{const p=d.data();if(p.summaryId)owned.add(p.summaryId);if(p.itemId)owned.add(p.itemId)});}
async function loadSummaries(){try{let q;if(subjectId)q=query(collection(db,'summaries'),where('subjectId','==',subjectId));else q=collection(db,'summaries');const snap=await getDocs(q);items=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.active!==false&&x.isActive!==false);if(subjectId){const s=await getDoc(doc(db,'subjects',subjectId));if(s.exists()){subjectName=s.data().name||s.data().title||'';document.querySelector('#pageTitle').innerHTML=`ملخصات ${esc(subjectName)} <span style="color:var(--purple)">.</span>`}}render()}catch(e){console.error(e);list.innerHTML='<div class="state"><strong>مش قادرين نحمّل الملخصات</strong>راجع صلاحيات قراءة summaries واتصال Firebase.</div>';say('فشل تحميل الملخصات من Firestore.')}}
function openItem(id){const x=items.find(a=>a.id===id);if(!x)return;const free=x.isFree===true||x.free===true||Number(x.price||0)<=0;if(!free&&!owned.has(id)){say('الملخص ده مدفوع؛ اشتريه الأول من رصيد المحفظة.');return}const url=urlOf(x);if(!url){say('الملخص لسه ملوش رابط محتوى.');return}const type=normalizedType(x.type);if(type==='youtube'){let idMatch=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);if(idMatch){window.open(`https://www.youtube-nocookie.com/embed/${idMatch[1]}`,'_blank','noopener');return}}window.open(url,'_blank','noopener,noreferrer')}
function beginBuy(id){const x=items.find(a=>a.id===id);if(!x)return;const price=Number(x.price||0);if(price<=0){openItem(id);return}if(walletBalance<price){say(`رصيدك ${money(walletBalance)} وسعر الملخص ${money(price)}. اشحن محفظتك الأول.`);return}pending=x;document.querySelector('#modalText').textContent=`هتشتري «${x.title||x.name||'الملخص'}» مقابل ${money(price)}. رصيدك الحالي ${money(walletBalance)}. هيتم تسجيل الشراء وخصم المبلغ لو العملية نجحت.`;modal.classList.add('show')}
async function purchase(){if(!pending||!userNow)return;const x=pending,price=Number(x.price||0);document.querySelector('#confirmBuy').disabled=true;try{const walletRef=doc(db,'wallets',userNow.uid);const purchaseRef=doc(db,'purchases',`${userNow.uid}_${x.id}`);await runTransaction(db,async tx=>{const [w,p]=await Promise.all([tx.get(walletRef),tx.get(purchaseRef)]);if(p.exists())throw new Error('ALREADY_OWNED');if(!w.exists())throw new Error('NO_WALLET');const data=w.data();const balance=Number(data.balance??data.amount??0);if(balance<price)throw new Error('LOW_BALANCE');tx.update(walletRef,{balance:balance-price,updatedAt:serverTimestamp()});tx.set(purchaseRef,{studentId:userNow.uid,summaryId:x.id,itemId:x.id,subjectId:x.subjectId||subjectId||null,title:x.title||x.name||'ملخص',price,status:'completed',purchasedAt:serverTimestamp()})});owned.add(x.id);modal.classList.remove('show');pending=null;render();say('تم الشراء بنجاح! تقدر تفتح الملخص دلوقتي.')}catch(e){console.error(e);if(e.message==='ALREADY_OWNED'){owned.add(x.id);say('الملخص ده موجود عندك بالفعل.')}else if(e.message==='LOW_BALANCE')say('رصيد المحفظة مش كافي. اشحن المحفظة وحاول تاني.');else if(e.message==='NO_WALLET')say('مش لاقيين محفظة مرتبطة بحسابك. تواصل مع الدعم.');else say('عملية الشراء مرفوضة. راجع قواعد Firestore؛ لازم تسمح بعملية شراء آمنة داخل transaction.')}finally{document.querySelector('#confirmBuy').disabled=false;render()}}
search.addEventListener('input',render);filter.addEventListener('change',render);document.querySelector('#confirmBuy').addEventListener('click',purchase);document.querySelector('#cancelBuy').addEventListener('click',()=>{modal.classList.remove('show');pending=null});modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('show');pending=null}});document.querySelector('#logoutBtn').addEventListener('click',async()=>{if(stopWallet)stopWallet();await signOut(auth);location.replace('../login.html')});
onAuthStateChanged(auth,async user=>{if(!user){location.replace('../login.html');return}userNow=user;try{await loadOwned()}catch(e){console.warn('Could not read purchases',e)}const walletRef=doc(db,'wallets',user.uid);stopWallet=onSnapshot(walletRef,snap=>{const d=snap.exists()?snap.data():{};walletBalance=Number(d.balance??d.amount??0)},e=>console.warn('Wallet listener:',e));await loadSummaries()});
window.addEventListener('beforeunload',()=>{if(stopWallet)stopWallet()});
</script></body></html>
