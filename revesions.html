<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الملخصات | Mathix Admin</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="./dashboard.html">Math<span class="ix">ix</span></a>
  <div class="account"><span id="adminEmail"></span><button class="btn btn-secondary" id="logoutBtn">خروج</button></div>
</div></header>

<div class="layout">
<aside class="sidebar">
  <div class="side-title">إدارة المنصة</div>
  <a class="nav-btn" href="./dashboard.html">📊 الرئيسية</a>
  <a class="nav-btn active" href="./revisions.html">📚 الملخصات</a>
  <a class="nav-btn" href="./wallet-requests.html">💳 طلبات الشحن</a>
  <a class="nav-btn" href="./wallets.html">👛 المحافظ</a>
  <a class="nav-btn" href="./purchases.html">🧾 المشتريات</a>
  <a class="nav-btn" href="./students.html">🎓 الطلاب</a>
  <a class="nav-btn" href="./settings.html">⚙️ الإعدادات</a>
</aside>

<main class="main">
  <section class="page-head">
    <div><h1>الملخصات</h1><p>إضافة وتعديل وحذف محتوى مجموعة revisions.</p></div>
    <button class="btn" id="addBtn">＋ إضافة ملخص</button>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input class="field" id="search" placeholder="ابحث عن ملخص...">
      <select class="field" id="filter">
        <option value="all">كل المواد</option>
        <option value="arabic">اللغة العربية</option>
        <option value="english">اللغة الإنجليزية</option>
        <option value="physics">الفيزياء</option>
        <option value="chemistry">الكيمياء</option>
        <option value="solid-geometry">الهندسة الفراغية</option>
        <option value="algebra">الجبر</option>
      </select>
    </div>

    <div class="table-wrap"><table>
      <thead><tr><th>العنوان</th><th>المادة</th><th>النوع</th><th>السعر</th><th>النشر</th><th>الإجراءات</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6">جارٍ التحميل...</td></tr></tbody>
    </table></div>
  </section>

  <div class="modal" id="editModal">
    <div class="modal-box">
      <div class="modal-head"><h2 id="modalTitle">إضافة ملخص</h2><button class="btn btn-secondary" data-close="editModal">إغلاق</button></div>
      <form id="revisionForm">
        <input type="hidden" id="itemId">
        <label>عنوان الملخص</label><input class="field" id="title" required maxlength="180">
        <div class="form-grid">
          <div><label>المادة</label><select class="field" id="subject">
            <option value="arabic">اللغة العربية</option><option value="english">اللغة الإنجليزية</option>
            <option value="physics">الفيزياء</option><option value="chemistry">الكيمياء</option>
            <option value="solid-geometry">الهندسة الفراغية</option><option value="algebra">الجبر</option>
          </select></div>
          <div><label>النوع</label><select class="field" id="type">
            <option value="pdf">PDF</option><option value="youtube">YouTube</option><option value="link">رابط خارجي</option>
          </select></div>
        </div>
        <label>رابط المحتوى</label><input class="field" id="url" type="url" required>
        <div class="form-grid">
          <div><label>السعر بالجنيه</label><input class="field" id="price" type="number" min="0" step=".01" value="0" required></div>
          <div><label>الحالة</label><select class="field" id="status"><option value="published">منشور</option><option value="draft">مسودة</option><option value="hidden">مخفي</option></select></div>
        </div>
        <label>الوصف</label><textarea class="field" id="description"></textarea>
        <label><input type="checkbox" id="free"> الملخص مجاني</label>
        <div class="modal-actions"><button class="btn" id="saveBtn">حفظ</button><button class="btn btn-secondary" type="button" data-close="editModal">إلغاء</button></div>
      </form>
    </div>
  </div>

  <div class="notice" id="notice"></div>
</main>
</div>
<script type="module" src="./revisions-page.js"></script>
</body>
</html>
