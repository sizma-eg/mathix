<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول الأدمن | Mathix</title>
  <link rel="icon" href="./logo.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section style="min-height:100vh;display:grid;place-items:center;padding:20px">
    <div class="panel" style="width:min(100%,440px);padding:30px">
      <a class="brand" href="./index.html">
        <img src="./logo.png" alt="Mathix" onerror="this.style.display='none'">
        <span>Math<span class="ix">ix</span></span>
      </a>

      <h2>تسجيل دخول الأدمن</h2>
      <p class="muted">استخدم حساب الإدارة المصرح له.</p>

      <form id="loginForm">
        <label for="email">البريد الإلكتروني</label>
        <input class="field" id="email" type="email" required autocomplete="username">

        <label for="password">كلمة المرور</label>
        <input class="field" id="password" type="password" required autocomplete="current-password">

        <button class="btn btn-block" id="loginBtn">تسجيل الدخول</button>
      </form>

      <div id="loginError" class="warning" hidden></div>
    </div>
  </section>

  <script type="module">
    import { auth, authReady } from "./firebase-config.js";
    import { ADMIN_EMAIL, isAuthorizedAdmin } from "./auth.js";
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const button = document.getElementById("loginBtn");

    await authReady;

    onAuthStateChanged(auth, user => {
      if (isAuthorizedAdmin(user)) {
        location.replace("./dashboard.html");
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      errorBox.hidden = true;
      button.disabled = true;

      try {
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;

        if (email !== ADMIN_EMAIL.toLowerCase()) {
          throw new Error("البريد الإلكتروني غير مصرح له بالإدارة.");
        }

        const result = await signInWithEmailAndPassword(auth, email, password);

        if (!isAuthorizedAdmin(result.user)) {
          throw new Error("الحساب غير مصرح له.");
        }

        location.replace("./dashboard.html");
      } catch (error) {
        errorBox.textContent = error.code === "auth/invalid-credential"
          ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
          : error.message || "تعذر تسجيل الدخول.";

        errorBox.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
