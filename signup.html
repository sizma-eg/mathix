<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07070b"
  >

  <meta
    name="description"
    content="إنشاء حساب طالب جديد على Mathix"
  >

  <title>Mathix | إنشاء حساب</title>

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07070b;
      --card: #101018;
      --border: rgba(255,255,255,.08);

      --white: #fff;
      --text: #f5f5f7;
      --muted: #92929f;

      --purple: #8b3dff;
      --purple-2: #a45cff;
      --purple-soft: rgba(139,61,255,.12);

      --danger: #ff5d6c;
      --success: #35d07f;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 15px;

      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(139,61,255,.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(139,61,255,.08),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family: "Cairo", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font-family: inherit;
    }

    .page {
      width: 100%;
      max-width: 500px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      margin-bottom: 25px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;

      object-fit: contain;

      animation: floatLogo 3s ease-in-out infinite;

      filter:
        drop-shadow(
          0 0 14px
          rgba(139,61,255,.22)
        );
    }

    @keyframes floatLogo {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

    }

    .brand-name {
      font-family: "Chakra Petch", sans-serif;

      font-size: 29px;
      font-weight: 700;

      direction: ltr;
    }

    .math {
      color: #fff;
    }

    .ix {
      color: var(--purple-2);
    }

    .card {
      padding: 30px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.015)
        );

      box-shadow:
        0 30px 90px rgba(0,0,0,.35);
    }

    .heading {
      text-align: center;

      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 25px;
      font-weight: 900;
    }

    .heading p {
      margin-top: 7px;

      color: var(--muted);
      font-size: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #b5b5c0;

      font-size: 11px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 13px;

      outline: none;

      background: rgba(0,0,0,.22);

      color: #fff;

      font-size: 12px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input:focus {
      border-color: rgba(139,61,255,.6);

      background: rgba(139,61,255,.035);

      box-shadow:
        0 0 0 3px
        rgba(139,61,255,.08);
    }

    input::placeholder {
      color: #5f5f6b;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-left: 50px;
    }

    .show-password {
      position: absolute;

      left: 8px;
      top: 50%;

      transform: translateY(-50%);

      width: 34px;
      height: 34px;

      border: 0;
      border-radius: 9px;

      background: transparent;

      color: #777783;

      font-size: 14px;
    }

    .show-password:hover {
      color: #fff;
      background: rgba(255,255,255,.05);
    }

    .password-note {
      margin-top: 6px;

      color: #676773;

      font-size: 9px;
      line-height: 1.6;
    }

    .terms {
      display: flex;
      align-items: flex-start;

      gap: 9px;

      margin: 4px 0 18px;
    }

    .terms input {
      width: 16px;
      height: 16px;

      flex-shrink: 0;

      margin-top: 2px;

      accent-color: var(--purple);
    }

    .terms label {
      margin: 0;

      color: #777783;

      font-size: 10px;
      line-height: 1.7;

      cursor: pointer;
    }

    .terms label strong {
      color: var(--purple-2);
    }

    .submit-btn {
      width: 100%;
      height: 51px;

      border: 0;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #7d2fff,
          #a45cff
        );

      color: #fff;

      font-size: 13px;
      font-weight: 800;

      box-shadow:
        0 12px 35px
        rgba(139,61,255,.2);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 16px 40px
        rgba(139,61,255,.3);
    }

    .submit-btn:disabled {
      cursor: not-allowed;
      opacity: .6;
      transform: none;
    }

    .message {
      display: none;

      margin-bottom: 15px;

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 10px;
      line-height: 1.7;
    }

    .message.error {
      display: block;

      color: #ff9ba4;

      border: 1px solid rgba(255,93,108,.2);

      background: rgba(255,93,108,.07);
    }

    .message.success {
      display: block;

      color: #75e7a8;

      border: 1px solid rgba(53,208,127,.2);

      background: rgba(53,208,127,.07);
    }

    .login-link {
      margin-top: 20px;

      text-align: center;

      color: #777783;

      font-size: 11px;
    }

    .login-link a {
      color: var(--purple-2);
      font-weight: 700;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;

      margin-top: 18px;

      color: #666672;

      text-align: center;

      font-size: 10px;
    }

    .back-home:hover {
      color: #aaaab5;
    }

    .loading {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;
    }

    .spinner {
      width: 15px;
      height: 15px;

      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    @media (max-width: 520px) {

      .card {
        padding: 23px 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .field.full {
        grid-column: auto;
      }

    }

  </style>

</head>

<body>

  <div class="page">

    <a
      href="index.html"
      class="brand"
    >

      <img
        src="logo.png"
        alt="Mathix"
        class="brand-logo"
      >

      <div class="brand-name">
        <span class="math">Math</span><span class="ix">ix</span>
      </div>

    </a>


    <div class="card">

      <div class="heading">

        <h1>
          إنشاء حساب جديد
        </h1>

        <p>
          ابدأ رحلتك الدراسية مع Mathix
        </p>

      </div>


      <div
        class="message"
        id="message"
      ></div>


      <form id="signupForm">

        <div class="form-grid">


          <div class="field">

            <label for="firstName">
              الاسم الأول
            </label>

            <input
              id="firstName"
              type="text"
              placeholder="مثال: زياد"
              autocomplete="given-name"
              maxlength="30"
              required
            >

          </div>


          <div class="field">

            <label for="secondName">
              الاسم الثاني
            </label>

            <input
              id="secondName"
              type="text"
              placeholder="مثال: وائل"
              autocomplete="family-name"
              maxlength="30"
              required
            >

          </div>


          <div class="field full">

            <label for="phone">
              رقم الهاتف
            </label>

            <input
              id="phone"
              type="tel"
              inputmode="numeric"
              placeholder="01xxxxxxxxx"
              autocomplete="tel"
              maxlength="11"
              required
            >

          </div>


          <div class="field full">

            <label for="email">
              البريد الإلكتروني
            </label>

            <input
              id="email"
              type="email"
              placeholder="example@gmail.com"
              autocomplete="email"
              required
            >

          </div>


          <div class="field">

            <label for="password">
              كلمة المرور
            </label>

            <div class="password-wrap">

              <input
                id="password"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
                minlength="6"
                required
              >

              <button
                type="button"
                class="show-password"
                data-target="password"
              >
                ◉
              </button>

            </div>

          </div>


          <div class="field">

            <label for="confirmPassword">
              تأكيد كلمة المرور
            </label>

            <div class="password-wrap">

              <input
                id="confirmPassword"
                type="password"
                placeholder="••••••••"
                autocomplete="new-password"
                minlength="6"
                required
              >

              <button
                type="button"
                class="show-password"
                data-target="confirmPassword"
              >
                ◉
              </button>

            </div>

          </div>

        </div>


        <div class="password-note">
          كلمة المرور يجب ألا تقل عن 6 أحرف.
        </div>


        <div class="terms">

          <input
            id="terms"
            type="checkbox"
            required
          >

          <label for="terms">
            أوافق على إنشاء حساب واستخدام منصة
            <strong>Mathix</strong>
            التعليمية.
          </label>

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          إنشاء الحساب
        </button>

      </form>


      <div class="login-link">

        لديك حساب بالفعل؟

        <a href="login.html">
          تسجيل الدخول
        </a>

      </div>

    </div>


    <a
      href="index.html"
      class="back-home"
    >
      ← العودة إلى الصفحة الرئيسية
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCH--HkIXYn3qhXZ9TwRItZrnMOIx_lWXk",

      authDomain:
        "mathix-2008.firebaseapp.com",

      projectId:
        "mathix-2008",

      storageBucket:
        "mathix-2008.firebasestorage.app",

      messagingSenderId:
        "561805658834",

      appId:
        "1:561805658834:web:c1db8ebc2d415be9497b0b",

      measurementId:
        "G-XWHKQ72FM0"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* =========================
       ELEMENTS
    ========================= */

    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");

    const submitBtn =
      document.getElementById("submitBtn");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className =
        `message ${type}`;

    }


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    document
      .querySelectorAll(".show-password")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const targetId =
              button.dataset.target;

            const input =
              document.getElementById(targetId);

            if (
              input.type === "password"
            ) {

              input.type = "text";

              button.textContent = "◌";

            } else {

              input.type = "password";

              button.textContent = "◉";

            }

          }
        );

      });


    /* =========================
       HELPERS
    ========================= */

    function generateStudentCode() {

      const random =
        Math.floor(
          100000 +
          Math.random() * 900000
        );

      return `Mathix-${random}`;

    }


    function isArabicName(name) {

      return /^[\u0600-\u06FF]+$/.test(
        name
      );

    }


    function isValidPhone(phone) {

      return /^01[0-9]{9}$/.test(
        phone
      );

    }


    /* =========================
       SIGNUP
    ========================= */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const firstName =
          document
            .getElementById("firstName")
            .value
            .trim();


        const secondName =
          document
            .getElementById("secondName")
            .value
            .trim();


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        /* =====================
           VALIDATION
        ===================== */

        if (
          !isArabicName(firstName) ||
          !isArabicName(secondName)
        ) {

          showMessage(
            "الاسم الأول والثاني يجب أن يكونا بالعربي ومن كلمة واحدة."
          );

          return;

        }


        if (!isValidPhone(phone)) {

          showMessage(
            "رقم الهاتف يجب أن يبدأ بـ 01 ويتكون من 11 رقمًا."
          );

          return;

        }


        if (password.length < 6) {

          showMessage(
            "كلمة المرور يجب ألا تقل عن 6 أحرف."
          );

          return;

        }


        if (password !== confirmPassword) {

          showMessage(
            "كلمتا المرور غير متطابقتين."
          );

          return;

        }


        /* =====================
           LOADING
        ===================== */

        submitBtn.disabled = true;

        submitBtn.innerHTML = `
          <span class="loading">
            <span class="spinner"></span>
            جاري إنشاء الحساب...
          </span>
        `;


        try {

          /* ===================
             CREATE AUTH USER
          =================== */

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            result.user;


          /* ===================
             STUDENT CODE
          =================== */

          const studentCode =
            generateStudentCode();


          /* ===================
             USERS DOCUMENT
          =================== */

          await setDoc(
            doc(
              db,
              "users",
              user.uid
            ),
            {

              uid:
                user.uid,

              studentCode:
                studentCode,

              firstName:
                firstName,

              secondName:
                secondName,

              fullName:
                `${firstName} ${secondName}`,

              phone:
                phone,

              email:
                email,

              role:
                "student",

              createdAt:
                serverTimestamp()

            }
          );


          /* ===================
             WALLET
          =================== */

          await setDoc(
            doc(
              db,
              "wallets",
              user.uid
            ),
            {

              uid:
                user.uid,

              balance:
                0,

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()

            }
          );


          showMessage(
            "تم إنشاء الحساب بنجاح. جاري تحويلك لتسجيل الدخول...",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                "login.html";

            },
            1800
          );


        } catch (error) {

          console.error(
            "Signup error:",
            error
          );


          let errorMessage =
            "حدث خطأ أثناء إنشاء الحساب.";


          switch (error.code) {

            case "auth/email-already-in-use":

              errorMessage =
                "البريد الإلكتروني مستخدم بالفعل.";

              break;


            case "auth/invalid-email":

              errorMessage =
                "البريد الإلكتروني غير صحيح.";

              break;


            case "auth/weak-password":

              errorMessage =
                "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.";

              break;


            case "auth/network-request-failed":

              errorMessage =
                "تأكد من اتصالك بالإنترنت.";

              break;


            case "auth/operation-not-allowed":

              errorMessage =
                "تسجيل الدخول بالبريد وكلمة المرور غير مفعّل في Firebase.";

              break;

          }


          showMessage(
            errorMessage
          );


          submitBtn.disabled =
            false;

          submitBtn.textContent =
            "إنشاء الحساب";

        }

      }
    );

  </script>

</body>

</html>
