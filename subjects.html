<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#09090f">
<title>Mathix | المواد الدراسية</title><link rel="icon" href="logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080d;--panel:#11111a;--panel2:#171722;--line:#29283a;--purple:#9b5cff;--purple2:#7138dc;--text:#f5f3fb;--muted:#a5a1b7;--green:#48d7a0;--red:#ff647c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#251342 0,transparent 38%),var(--bg);color:var(--text);font-family:Cairo, sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.top{height:76px;border-bottom:1px solid #ffffff12;background:#09090fdd;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 max(5%,calc((100% - 1200px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font:700 25px 'Chakra Petch',sans-serif;direction:ltr}.brand img{width:39px;height:39px;object-fit:contain;animation:float 3s ease-in-out infinite}.brand span{color:#fff}.brand b{color:var(--purple)}@keyframes float{50%{transform:translateY(-5px)}}.nav{display:flex;gap:10px;align-items:center}.nav a,.nav button{border:1px solid var(--line);background:#ffffff06;color:var(--text);padding:9px 14px;border-radius:12px;font-size:13px}.nav .active{background:#9b5cff1b;border-color:#9b5cff66;color:#c7a6ff}.wrap{max-width:1200px;margin:auto;padding:38px 22px 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:8px 0 28px}.eyebrow{color:#c5a6ff;font-size:12px;font-weight:800;letter-spacing:.5px}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.25;margin:8px 0}.hero p{color:var(--muted);margin:0;max-width:620px;font-size:14px}.count{border:1px solid #9b5cff45;background:#9b5cff12;color:#d7c4ff;border-radius:15px;padding:12px 16px;white-space:nowrap;font-size:13px}.toolbar{display:flex;gap:12px;margin-bottom:22px}.search{width:100%;background:#101019;border:1px solid var(--line);color:white;border-radius:14px;padding:14px 16px;outline:none;font:inherit}.search:focus{border-color:var(--purple)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#171722,#0f0f17);padding:22px;min-height:205px;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#9b5cff8c;box-shadow:0 15px 45px #0005}.card:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:#9b5cff12;filter:blur(3px);left:-50px;top:-60px}.symbol{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#9b5cff1c;border:1px solid #9b5cff35;color:#d8c3ff;font-size:24px;margin-bottom:18px}.card h2{font-size:20px;margin:0 0 5px;position:relative}.card p{color:var(--muted);font-size:13px;margin:0 0 22px}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:11px;color:#bdb7cf;background:#ffffff09;border:1px solid #ffffff12;border-radius:30px;padding:6px 10px}.go{background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;border:0;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:800}.state{padding:34px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);grid-column:1/-1}.state strong{display:block;color:white;font-size:18px;margin-bottom:7px}.toast{position:fixed;bottom:20px;left:20px;z-index:10;background:#1c1b28;border:1px solid var(--line);border-radius:12px;padding:13px 16px;max-width:calc(100% - 40px);display:none}.toast.show{display:block}.footer{text-align:center;color:#716c82;font-size:12px;margin-top:35px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:start;flex-direction:column}.top{padding:0 18px}.nav a{padding:8px 10px}}@media(max-width:540px){.grid{grid-template-columns:1fr}.wrap{padding:26px 15px 50px}.top{height:66px}.brand{font-size:22px}.brand img{width:32px;height:32px}.nav a{font-size:11px}.nav .hide-mobile{display:none}.card{min-height:185px}}
</style></head>
<body>
<header class="top"><a class="brand" href="dashboard.html"><img src="logo.png" alt="Mathix"><span>Math<b>ix</b></span></a><nav class="nav"><a href="dashboard.html">لوحة الطالب</a><a class="active" href="subjects.html">المواد</a><a class="hide-mobile" href="wallet.html">المحفظة</a><button id="logoutBtn" type="button">تسجيل الخروج</button></nav></header>
<main class="wrap"><section class="hero"><div><div class="eyebrow">MATHIX LEARNING SPACE</div><h1>المواد الدراسية <span style="color:var(--purple)">.</span></h1><p>اختار المادة وابدأ مذاكرتك. الملخصات المتاحة بتظهر حسب المحتوى اللي اتضاف للمنصة.</p></div><div class="count" id="subjectCount">جاري تحميل المواد...</div></section><div class="toolbar"><input class="search" id="searchInput" type="search" placeholder="ابحث عن مادة..." autocomplete="off"></div><section class="grid" id="subjectsGrid"><div class="state"><strong>بنجهز المواد...</strong>لحظة واحدة يا بطل</div></section><div class="footer">Mathix © 2026 — خطوة صغيرة كل يوم تصنع فرقًا كبيرًا.</div></main><div class="toast" id="toast" role="status"></div>
<script type="module">
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, getDocs, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { auth, db } from './firebase-config.js';
const grid=document.querySelector('#subjectsGrid'), count=document.querySelector('#subjectCount'), search=document.querySelector('#searchInput'), toast=document.querySelector('#toast');let allSubjects=[];
const fallback=[{id:'arabic',name:'اللغة العربية',icon:'أ',description:'النحو والبلاغة والأدب والنصوص'},{id:'english',name:'اللغة الإنجليزية',icon:'A',description:'Grammar وVocabulary وReading'},{id:'physics',name:'الفيزياء',icon:'ϟ',description:'افهم القوانين وطبّق عليها'},{id:'chemistry',name:'الكيمياء',icon:'⚗',description:'المفاهيم والمعادلات والتدريبات'},{id:'solid-geometry',name:'الهندسة الفراغية',icon:'⌬',description:'الأشكال والعلاقات الهندسية'},{id:'algebra',name:'الجبر',icon:'∑',description:'الدوال والمعادلات والمسائل'}];
function say(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)}
function render(){const term=search.value.trim().toLocaleLowerCase('ar');const items=allSubjects.filter(s=>(s.name||s.title||'').toLocaleLowerCase('ar').includes(term));count.textContent=`${items.length} ${items.length===1?'مادة':'مواد'}`;if(!items.length){grid.innerHTML='<div class="state"><strong>مش لاقيين مادة بالاسم ده</strong>جرّب كلمة تانية في البحث.</div>';return}grid.innerHTML=items.map(s=>{const name=s.name||s.title||'مادة دراسية';const icon=s.icon||'∑';const desc=s.description||s.subtitle||'افتح المادة للاطلاع على الملخصات المتاحة.';return `<article class="card"><div class="symbol">${esc(icon)}</div><h2>${esc(name)}</h2><p>${esc(desc)}</p><div class="card-foot"><span class="pill">محتوى دراسي</span><button class="go" data-open="${esc(s.id)}">عرض الملخصات ←</button></div></article>`}).join('');grid.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{location.href='revisions/revesions.html?subject='+encodeURIComponent(b.dataset.open)}))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
search.addEventListener('input',render);
onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}try{const snap=await getDocs(collection(db,'subjects'));const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.active!==false&&s.isActive!==false);allSubjects=docs.length?docs:fallback;render();if(!docs.length)say('مفيش مواد مضافة في قاعدة البيانات حاليًا؛ بنعرض المواد الأساسية لحد ما تضيفها من لوحة الإدارة.')}catch(e){console.error(e);allSubjects=fallback;render();say('تعذر تحميل المواد من قاعدة البيانات. راجع اتصال Firebase وصلاحيات القراءة.')}});
document.querySelector('#logoutBtn').addEventListener('click',async()=>{try{await signOut(auth);location.replace('login.html')}catch(e){say('حصلت مشكلة أثناء تسجيل الخروج.')}});
</script></body></html>
